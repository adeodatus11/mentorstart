<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4"/>
      <stop offset="100%" style="stop-color:#e8f4fb"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="700" height="400" fill="url(#bg)" rx="16"/>
  <rect width="700" height="5" fill="#2D7D4F" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="660" height="54" rx="10" fill="#2D7D4F"/>
  <text x="350" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">ETAP 1 · PIERWSZY TYDZIEŃ PRACY</text>
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#a8d8bc">5 rzeczy do uruchomienia — dostępy, narzędzia i procedury</text>

  <!-- Central number -->
  <circle cx="350" cy="195" r="46" fill="#2D7D4F" filter="url(#sh)"/>
  <circle cx="350" cy="195" r="38" fill="white" opacity="0.15"/>
  <text x="350" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="white">TYDZIEŃ</text>
  <text x="350" y="207" text-anchor="middle" font-size="30" font-weight="700" fill="white">1</text>

  <!-- Connecting lines -->
  <line x1="304" y1="175" x2="198" y2="135" stroke="#2D7D4F" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="304" y1="195" x2="178" y2="195" stroke="#3a8a5a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="316" y1="220" x2="198" y2="270" stroke="#1E6B9E" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="396" y1="175" x2="502" y2="135" stroke="#d4820a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="396" y1="215" x2="510" y2="265" stroke="#8a4a9a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Item 1: Dziennik -->
  <g filter="url(#sh)">
    <rect x="60" y="96" width="138" height="88" rx="10" fill="white"/>
    <rect x="60" y="96" width="138" height="5" rx="2" fill="#2D7D4F"/>
    <text x="80" y="117" font-size="22">📓</text>
    <text x="129" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">DZIENNIK</text>
    <text x="129" y="134" text-anchor="middle" font-size="10" fill="#4a7a5a">Elektroniczny</text>
    <text x="129" y="147" text-anchor="middle" font-size="10" fill="#4a7a5a">— logowanie, tematy</text>
    <text x="129" y="161" text-anchor="middle" font-size="10" fill="#4a7a5a">i pierwsze obecności</text>
    <rect x="72" y="172" width="114" height="7" rx="3" fill="#2D7D4F" opacity="0.15"/>
  </g>

  <!-- Item 2: Poczta -->
  <g filter="url(#sh)">
    <rect x="30" y="152" width="148" height="88" rx="10" fill="white"/>
    <rect x="30" y="152" width="148" height="5" rx="2" fill="#3a8a5a"/>
    <text x="50" y="172" font-size="22">✉️</text>
    <text x="116" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">POCZTA</text>
    <text x="116" y="189" text-anchor="middle" font-size="10" fill="#4a7a5a">Szkolna skrzynka</text>
    <text x="116" y="202" text-anchor="middle" font-size="10" fill="#4a7a5a">e-mail – hasło,</text>
    <text x="116" y="215" text-anchor="middle" font-size="10" fill="#4a7a5a">kontakty sekretariatu</text>
    <rect x="42" y="228" width="124" height="7" rx="3" fill="#3a8a5a" opacity="0.15"/>
  </g>

  <!-- Item 3: Klucze/sale -->
  <g filter="url(#sh)">
    <rect x="56" y="222" width="142" height="88" rx="10" fill="white"/>
    <rect x="56" y="222" width="142" height="5" rx="2" fill="#1E6B9E"/>
    <text x="76" y="242" font-size="22">🔑</text>
    <text x="148" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">KLUCZE / SALE</text>
    <text x="148" y="260" text-anchor="middle" font-size="10" fill="#4a6a7a">Numery sal, klucz,</text>
    <text x="148" y="273" text-anchor="middle" font-size="10" fill="#4a6a7a">dostęp do kopiarkii</text>
    <text x="148" y="286" text-anchor="middle" font-size="10" fill="#4a6a7a">i pracowni</text>
    <rect x="68" y="298" width="118" height="7" rx="3" fill="#1E6B9E" opacity="0.15"/>
  </g>

  <!-- Item 4: Plan lekcji -->
  <g filter="url(#sh)">
    <rect x="500" y="96" width="142" height="88" rx="10" fill="white"/>
    <rect x="500" y="96" width="142" height="5" rx="2" fill="#d4820a"/>
    <text x="520" y="117" font-size="22">📅</text>
    <text x="591" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">PLAN LEKCJI</text>
    <text x="591" y="134" text-anchor="middle" font-size="10" fill="#7a5a2a">Rozkład zajęć,</text>
    <text x="591" y="147" text-anchor="middle" font-size="10" fill="#7a5a2a">zastępstwa,</text>
    <text x="591" y="160" text-anchor="middle" font-size="10" fill="#7a5a2a">zmianowość</text>
    <rect x="512" y="172" width="118" height="7" rx="3" fill="#d4820a" opacity="0.15"/>
  </g>

  <!-- Item 5: Nieobecności -->
  <g filter="url(#sh)">
    <rect x="494" y="224" width="154" height="88" rx="10" fill="white"/>
    <rect x="494" y="224" width="154" height="5" rx="2" fill="#8a4a9a"/>
    <text x="514" y="244" font-size="22">📋</text>
    <text x="591" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">NIEOBECNOŚCI</text>
    <text x="591" y="261" text-anchor="middle" font-size="10" fill="#5a3a6a">Jak zgłosić nieobecność,</text>
    <text x="591" y="274" text-anchor="middle" font-size="10" fill="#5a3a6a">kto zastępuje,</text>
    <text x="591" y="287" text-anchor="middle" font-size="10" fill="#5a3a6a">formularz do sekretariatu</text>
    <rect x="506" y="300" width="130" height="7" rx="3" fill="#8a4a9a" opacity="0.15"/>
  </g>

  <!-- Bottom note -->
  <rect x="30" y="338" width="640" height="46" rx="10" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="350" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#2D7D4F">💡 WSKAZÓWKA MENTORA:</text>
  <text x="350" y="375" text-anchor="middle" font-size="10" fill="#1a3a2a">Spotkaj się z mentorem w ciągu pierwszych 3 dni — omów wszystkie 5 punktów razem i zapisz ustalenia w dzienniku wdrożenia.</text>
</svg>
