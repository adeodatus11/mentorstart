<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4"/>
      <stop offset="100%" style="stop-color:#e8f4fb"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="800" height="440" fill="url(#bg)" rx="16"/>
  <rect width="800" height="5" fill="#2D7D4F" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="760" height="60" rx="10" fill="#2D7D4F"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="white" letter-spacing="0.5">BAZA WIEDZY MENTORA</text>
  <text x="400" y="60" text-anchor="middle" font-size="11" fill="#a8d8bc">Mapa zasobów — wszystko czego potrzebujesz na jednej stronie</text>

  <!-- Central hub -->
  <circle cx="400" cy="240" r="56" fill="#2D7D4F" filter="url(#sh)"/>
  <circle cx="400" cy="240" r="46" fill="white" opacity="0.1"/>
  <text x="400" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="white">CENTRUM</text>
  <text x="400" y="248" text-anchor="middle" font-size="11" fill="#c0e8d0">WIEDZY</text>
  <text x="400" y="264" text-anchor="middle" font-size="22">🎓</text>

  <!-- Connection lines to cards -->
  <line x1="344" y1="210" x2="248" y2="158" stroke="#2D7D4F" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="344" y1="240" x2="226" y2="240" stroke="#3a8a5a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="356" y1="270" x2="248" y2="320" stroke="#1E6B9E" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="456" y1="210" x2="556" y2="158" stroke="#d4820a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="456" y1="240" x2="574" y2="240" stroke="#8a4a9a" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="444" y1="270" x2="556" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="400" y1="184" x2="400" y2="110" stroke="#165a8e" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Card 1: Dokumenty i procedury (top-left) -->
  <g filter="url(#sh)">
    <rect x="100" y="92" width="148" height="100" rx="10" fill="white"/>
    <rect x="100" y="92" width="148" height="8" rx="4" fill="#2D7D4F"/>
    <text x="174" y="117" text-anchor="middle" font-size="20">📄</text>
    <text x="174" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">DOKUMENTY</text>
    <text x="174" y="152" text-anchor="middle" font-size="10" fill="#4a7a5a">I PROCEDURY</text>
    <text x="174" y="168" text-anchor="middle" font-size="9" fill="#2D7D4F">PSO · Statut · Regulaminy</text>
    <text x="174" y="182" text-anchor="middle" font-size="9" fill="#2D7D4F">Procedury szkolne</text>
  </g>

  <!-- Card 2: Rozmowy mentorskie (left) -->
  <g filter="url(#sh)">
    <rect x="60" y="196" width="166" height="100" rx="10" fill="white"/>
    <rect x="60" y="196" width="166" height="8" rx="4" fill="#3a8a5a"/>
    <text x="143" y="220" text-anchor="middle" font-size="20">💬</text>
    <text x="143" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">ROZMOWY</text>
    <text x="143" y="254" text-anchor="middle" font-size="10" fill="#4a7a5a">MENTORSKIE</text>
    <text x="143" y="270" text-anchor="middle" font-size="9" fill="#3a8a5a">Scenariusze · Pytania</text>
    <text x="143" y="284" text-anchor="middle" font-size="9" fill="#3a8a5a">Techniki feedbacku</text>
  </g>

  <!-- Card 3: Prawo oświatowe (bottom-left) -->
  <g filter="url(#sh)">
    <rect x="100" y="312" width="148" height="100" rx="10" fill="white"/>
    <rect x="100" y="312" width="148" height="8" rx="4" fill="#1E6B9E"/>
    <text x="174" y="335" text-anchor="middle" font-size="20">⚖️</text>
    <text x="174" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">PRAWO</text>
    <text x="174" y="369" text-anchor="middle" font-size="10" fill="#4a6a7a">OŚWIATOWE</text>
    <text x="174" y="385" text-anchor="middle" font-size="9" fill="#1E6B9E">KN · Ustawa oświatowa</text>
    <text x="174" y="399" text-anchor="middle" font-size="9" fill="#1E6B9E">Prawa ucznia · Awans</text>
  </g>

  <!-- Card 4: Uczeń w kryzysie (top-right) -->
  <g filter="url(#sh)">
    <rect x="552" y="92" width="148" height="100" rx="10" fill="white"/>
    <rect x="552" y="92" width="148" height="8" rx="4" fill="#c0392b"/>
    <text x="626" y="117" text-anchor="middle" font-size="20">🆘</text>
    <text x="626" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">UCZEŃ</text>
    <text x="626" y="152" text-anchor="middle" font-size="10" fill="#7a2a2a">W KRYZYSIE</text>
    <text x="626" y="168" text-anchor="middle" font-size="9" fill="#c0392b">Procedury · Kontakty</text>
    <text x="626" y="182" text-anchor="middle" font-size="9" fill="#c0392b">Pedagog · Psycholog</text>
  </g>

  <!-- Card 5: Rodzice (right) -->
  <g filter="url(#sh)">
    <rect x="574" y="196" width="166" height="100" rx="10" fill="white"/>
    <rect x="574" y="196" width="166" height="8" rx="4" fill="#8a4a9a"/>
    <text x="657" y="220" text-anchor="middle" font-size="20">👨‍👩‍👧</text>
    <text x="657" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">RODZICE</text>
    <text x="657" y="254" text-anchor="middle" font-size="10" fill="#5a3a7a">I OPIEKUNOWIE</text>
    <text x="657" y="270" text-anchor="middle" font-size="9" fill="#8a4a9a">Trudne rozmowy</text>
    <text x="657" y="284" text-anchor="middle" font-size="9" fill="#8a4a9a">Zebrania · E-mail</text>
  </g>

  <!-- Card 6: Dobrostan (bottom-right) -->
  <g filter="url(#sh)">
    <rect x="552" y="312" width="148" height="100" rx="10" fill="white"/>
    <rect x="552" y="312" width="148" height="8" rx="4" fill="#d4820a"/>
    <text x="626" y="335" text-anchor="middle" font-size="20">🌱</text>
    <text x="626" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">DOBROSTAN</text>
    <text x="626" y="369" text-anchor="middle" font-size="10" fill="#7a5a2a">NAUCZYCIELA</text>
    <text x="626" y="385" text-anchor="middle" font-size="9" fill="#d4820a">Wypalenie · Stres</text>
    <text x="626" y="399" text-anchor="middle" font-size="9" fill="#d4820a">Wsparcie · Zasoby</text>
  </g>

  <!-- Card 7: Etapy wdrożenia (top-center) -->
  <g filter="url(#sh)">
    <rect x="320" y="26" width="160" height="72" rx="10" fill="white"/>
    <rect x="320" y="26" width="160" height="8" rx="4" fill="#165a8e"/>
    <text x="400" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">ETAPY WDROŻENIA</text>
    <text x="400" y="64" text-anchor="middle" font-size="9" fill="#4a6a7a">Tydzień 0–4 · Miesiąc 2</text>
    <text x="400" y="78" text-anchor="middle" font-size="9" fill="#165a8e">Półrocze 1–2 · Koniec roku</text>
  </g>
</svg>
