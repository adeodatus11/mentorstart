<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf8f0"/>
      <stop offset="100%" style="stop-color:#fef4e8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2D7D4F"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1E6B9E"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d4820a"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="url(#bg)" rx="16"/>
  <rect width="760" height="5" fill="#c0392b" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="720" height="54" rx="10" fill="#c0392b"/>
  <text x="380" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">ETAP 4 · PROCEDURY SZYBKIEJ REAKCJI</text>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#f4c0b8">Drzewo decyzyjne — co zrobić i do kogo się zwrócić</text>

  <!-- Start node -->
  <g filter="url(#sh)">
    <rect x="280" y="86" width="200" height="48" rx="24" fill="#c0392b"/>
    <text x="380" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="white">TRUDNA SYTUACJA</text>
    <text x="380" y="122" text-anchor="middle" font-size="10" fill="#f8d0c8">Co się dzieje? Oceń rodzaj problemu</text>
  </g>

  <!-- 3 branches from start -->
  <line x1="280" y1="110" x2="122" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="380" y1="134" x2="380" y2="168" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="480" y1="110" x2="638" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Branch labels -->
  <text x="160" y="155" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">TRUDNA KLASA</text>
  <text x="380" y="162" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">TRUDNY RODZIC</text>
  <text x="600" y="155" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">UCZEŃ W KRYZYSIE</text>

  <!-- Branch 1: Trudna klasa -->
  <g filter="url(#sh)">
    <rect x="40" y="172" width="164" height="90" rx="10" fill="white"/>
    <rect x="40" y="172" width="164" height="8" rx="4" fill="#2D7D4F"/>
    <text x="122" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">TRUDNA KLASA</text>
    <text x="52" y="210" font-size="9" fill="#4a7a5a">1. Opisz konkretne zachowanie</text>
    <text x="52" y="224" font-size="9" fill="#4a7a5a">2. Poinformuj mentora w dniu</text>
    <text x="52" y="238" font-size="9" fill="#4a7a5a">3. Zapisz w dzienniku wdrożenia</text>
    <text x="52" y="252" font-size="9" fill="#2D7D4F">→ Mentor pomoże w reakcji</text>
  </g>
  <!-- Eskalacja klasa -->
  <line x1="122" y1="262" x2="122" y2="300" stroke="#2D7D4F" stroke-width="1.5" marker-end="url(#arrG)"/>
  <g filter="url(#sh)">
    <rect x="40" y="302" width="164" height="70" rx="10" fill="#f0f7f4"/>
    <rect x="40" y="302" width="164" height="6" rx="3" fill="#2D7D4F" opacity="0.5"/>
    <text x="122" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3a2a">ESKALACJA</text>
    <text x="52" y="336" font-size="9" fill="#4a7a5a">● Wychowawca klasy</text>
    <text x="52" y="350" font-size="9" fill="#4a7a5a">● Pedagog/psycholog</text>
    <text x="52" y="364" font-size="9" fill="#2D7D4F">→ Dyrekcja (jeśli konieczne)</text>
  </g>

  <!-- Branch 2: Trudny rodzic -->
  <g filter="url(#sh)">
    <rect x="298" y="170" width="164" height="90" rx="10" fill="white"/>
    <rect x="298" y="170" width="164" height="8" rx="4" fill="#1E6B9E"/>
    <text x="380" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">TRUDNY RODZIC</text>
    <text x="308" y="208" font-size="9" fill="#4a6a7a">1. Wysłuchaj bez oceniania</text>
    <text x="308" y="222" font-size="9" fill="#4a6a7a">2. Zapisz fakty, nie opinie</text>
    <text x="308" y="236" font-size="9" fill="#4a6a7a">3. Zaproś do spotkania</text>
    <text x="308" y="250" font-size="9" fill="#1E6B9E">→ Nie decyduj sam/a</text>
  </g>
  <!-- Eskalacja rodzic -->
  <line x1="380" y1="260" x2="380" y2="298" stroke="#1E6B9E" stroke-width="1.5" marker-end="url(#arrB)"/>
  <g filter="url(#sh)">
    <rect x="298" y="300" width="164" height="70" rx="10" fill="#f0f4f8"/>
    <rect x="298" y="300" width="164" height="6" rx="3" fill="#1E6B9E" opacity="0.5"/>
    <text x="380" y="318" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3a2a">ESKALACJA</text>
    <text x="308" y="334" font-size="9" fill="#4a6a7a">● Wychowawca / mentor</text>
    <text x="308" y="348" font-size="9" fill="#4a6a7a">● Spotkanie z rodzicami</text>
    <text x="308" y="362" font-size="9" fill="#1E6B9E">→ Dyrekcja (jeśli konieczne)</text>
  </g>

  <!-- Branch 3: Uczeń w kryzysie -->
  <g filter="url(#sh)">
    <rect x="556" y="172" width="164" height="90" rx="10" fill="white"/>
    <rect x="556" y="172" width="164" height="8" rx="4" fill="#c0392b"/>
    <text x="638" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">UCZEŃ W KRYZYSIE</text>
    <text x="566" y="210" font-size="9" fill="#7a2a2a">1. Zapewnij bezpieczeństwo</text>
    <text x="566" y="224" font-size="9" fill="#7a2a2a">2. Wezwij pedagoga/psychologa</text>
    <text x="566" y="238" font-size="9" fill="#7a2a2a">3. Poinformuj wychowawcę</text>
    <text x="566" y="252" font-size="9" fill="#c0392b">⚠ Działaj natychmiast</text>
  </g>
  <!-- Eskalacja kryzys -->
  <line x1="638" y1="262" x2="638" y2="300" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <g filter="url(#sh)">
    <rect x="556" y="302" width="164" height="70" rx="10" fill="#fdf0ee"/>
    <rect x="556" y="302" width="164" height="6" rx="3" fill="#c0392b" opacity="0.5"/>
    <text x="638" y="320" text-anchor="middle" font-size="9" font-weight="700" fill="#1a3a2a">ESKALACJA</text>
    <text x="566" y="336" font-size="9" fill="#7a2a2a">● Pedagog/psycholog szkolny</text>
    <text x="566" y="350" font-size="9" fill="#7a2a2a">● Wychowawca + dyrekcja</text>
    <text x="566" y="364" font-size="9" fill="#c0392b">→ Pogotowie (jeśli zagrożenie)</text>
  </g>

  <!-- Wypadek/sytuacja krytyczna -->
  <line x1="122" y1="372" x2="380" y2="410" stroke="#d4820a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="638" y1="372" x2="380" y2="410" stroke="#d4820a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="380" y1="370" x2="380" y2="410" stroke="#d4820a" stroke-width="1.5"/>

  <!-- Bottom common: Dokumentuj -->
  <g filter="url(#sh)">
    <rect x="200" y="412" width="360" height="50" rx="12" fill="#d4820a"/>
    <text x="380" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="white">ZAWSZE: DOKUMENTUJ I INFORMUJ</text>
    <text x="380" y="450" text-anchor="middle" font-size="10" fill="#fff3e0">Zapisz fakty w dzienniku wdrożenia · Powiedz mentorowi tego samego dnia</text>
  </g>
</svg>
