<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4"/>
      <stop offset="100%" style="stop-color:#e8f4ee"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0f8"/>
      <stop offset="100%" style="stop-color:#deeaf8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <!-- Background split -->
  <rect width="380" height="380" fill="url(#bgL)" rx="16"/>
  <rect x="380" width="380" height="380" fill="url(#bgR)"/>
  <!-- Round right corners only -->
  <rect x="364" width="396" height="380" fill="url(#bgR)" rx="16"/>
  <rect x="364" width="32" height="380" fill="url(#bgR)"/>

  <!-- Top divider line -->
  <rect width="760" height="5" fill="#2D7D4F" rx="2"/>
  <rect x="380" width="380" height="5" fill="#1E6B9E" rx="0"/>

  <!-- Center divider -->
  <line x1="380" y1="10" x2="380" y2="380" stroke="#d0d8e0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Left: MENTOR header -->
  <rect x="16" y="14" width="350" height="52" rx="10" fill="#2D7D4F"/>
  <text x="191" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="white">STREFA MENTORA</text>
  <text x="191" y="54" text-anchor="middle" font-size="10" fill="#a8d8bc">Zarządza procesem wdrożenia</text>

  <!-- Right: NAUCZYCIEL header -->
  <rect x="394" y="14" width="350" height="52" rx="10" fill="#1E6B9E"/>
  <text x="569" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="white">STREFA NAUCZYCIELA</text>
  <text x="569" y="54" text-anchor="middle" font-size="10" fill="#a8d0f4">Wykonuje zadania wdrożenia</text>

  <!-- Left: Mentor avatar -->
  <circle cx="191" cy="118" r="32" fill="#e8f6ef"/>
  <circle cx="191" cy="110" r="14" fill="#2D7D4F"/>
  <path d="M159,132 Q191,118 223,132" stroke="#2D7D4F" stroke-width="3" fill="none"/>
  <rect x="178" y="148" width="26" height="6" rx="3" fill="#2D7D4F" opacity="0.5"/>
  <text x="191" y="164" text-anchor="middle" font-size="9" fill="#4a7a5a">OPIEKUN STAŻU</text>

  <!-- Right: Teacher avatar -->
  <circle cx="569" cy="118" r="32" fill="#e8f0f8"/>
  <circle cx="569" cy="110" r="14" fill="#1E6B9E"/>
  <path d="M537,132 Q569,118 601,132" stroke="#1E6B9E" stroke-width="3" fill="none"/>
  <rect x="556" y="148" width="26" height="6" rx="3" fill="#1E6B9E" opacity="0.5"/>
  <text x="569" y="164" text-anchor="middle" font-size="9" fill="#4a6a7a">NAUCZYCIEL POCZĄTKUJĄCY</text>

  <!-- Left mentor responsibilities -->
  <rect x="26" y="178" width="330" height="172" rx="10" fill="white" filter="url(#sh)"/>
  <rect x="26" y="178" width="330" height="6" rx="3" fill="#2D7D4F"/>

  <text x="191" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">ODPOWIADA ZA:</text>
  <text x="42" y="222" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="222" font-size="10" fill="#1a3a2a">Planowanie i harmonogram spotkań</text>
  <text x="42" y="238" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="238" font-size="10" fill="#1a3a2a">Obserwacje lekcji z formularzem</text>
  <text x="42" y="254" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="254" font-size="10" fill="#1a3a2a">Informacja zwrotna (co + jak)</text>
  <text x="42" y="270" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="270" font-size="10" fill="#1a3a2a">Weryfikacja kompletności dokumentów</text>
  <text x="42" y="286" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="286" font-size="10" fill="#1a3a2a">Eskalacja do dyrekcji (jeśli konieczne)</text>
  <text x="42" y="302" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="302" font-size="10" fill="#1a3a2a">Raport roczny z wdrożenia</text>
  <text x="42" y="318" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="318" font-size="10" fill="#1a3a2a">Rekomendacja oceny nauczyciela</text>
  <text x="42" y="334" font-size="10" fill="#2D7D4F">▶</text><text x="54" y="334" font-size="10" fill="#1a3a2a">Dbałość o dobrostan podopiecznego</text>

  <!-- Right teacher responsibilities -->
  <rect x="404" y="178" width="340" height="172" rx="10" fill="white" filter="url(#sh)"/>
  <rect x="404" y="178" width="340" height="6" rx="3" fill="#1E6B9E"/>

  <text x="574" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">ODPOWIADA ZA:</text>
  <text x="420" y="222" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="222" font-size="10" fill="#1a3a2a">Realizację zadań z checklisty</text>
  <text x="420" y="238" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="238" font-size="10" fill="#1a3a2a">Kompletność dziennika i dokumentów</text>
  <text x="420" y="254" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="254" font-size="10" fill="#1a3a2a">Aktywne uczestnictwo w spotkaniach</text>
  <text x="420" y="270" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="270" font-size="10" fill="#1a3a2a">Zgłaszanie trudności mentorowi</text>
  <text x="420" y="286" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="286" font-size="10" fill="#1a3a2a">Realizację celów rozwojowych</text>
  <text x="420" y="302" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="302" font-size="10" fill="#1a3a2a">Samoocenę adaptacji (co 2 tygodnie)</text>
  <text x="420" y="318" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="318" font-size="10" fill="#1a3a2a">Dokumenty awansu zawodowego</text>
  <text x="420" y="334" font-size="10" fill="#1E6B9E">▶</text><text x="432" y="334" font-size="10" fill="#1a3a2a">Dbałość o własny dobrostan</text>

  <!-- Center bridge label -->
  <rect x="340" y="230" width="80" height="36" rx="12" fill="white" filter="url(#sh)" opacity="0.95"/>
  <text x="380" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#2D7D4F">WSPÓLNIE</text>
  <text x="380" y="259" text-anchor="middle" font-size="8" fill="#1a3a2a">budują relację</text>
</svg>
