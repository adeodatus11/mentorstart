<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eef6fb"/>
      <stop offset="100%" style="stop-color:#f0f7f4"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D7D4F"/>
      <stop offset="100%" style="stop-color:#1E6B9E"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="720" height="400" fill="url(#bg)" rx="16"/>
  <rect width="720" height="5" fill="url(#scaleGrad)" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="680" height="54" rx="10" fill="url(#scaleGrad)"/>
  <text x="360" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">PÓŁROCZE 2 · SAMODZIELNOŚĆ I AWANS</text>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#c0e8d8">Od wsparcia mentora do rosnącej samodzielności nauczyciela</text>

  <!-- Scale bar: support → independence -->
  <rect x="40" y="90" width="640" height="24" rx="12" fill="#e0e8f0"/>
  <rect x="40" y="90" width="480" height="24" rx="12" fill="url(#scaleGrad)" opacity="0.7"/>
  <text x="360" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="white">POZIOM SAMODZIELNOŚCI — ROŚNIE W II PÓŁROCZU</text>

  <!-- Left side: Mentor support (diminishing) -->
  <g filter="url(#sh)">
    <rect x="30" y="130" width="200" height="220" rx="12" fill="white"/>
    <rect x="30" y="130" width="200" height="34" rx="10" fill="#2D7D4F"/>
    <text x="130" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="white">WSPARCIE MENTORA</text>
    <text x="130" y="158" text-anchor="middle" font-size="9" fill="#a8d8bc">maleje, ale jest dostępne</text>

    <text x="46" y="180" font-size="10" fill="#4a7a5a">→ Obserwacje co 4–6 tygodni</text>
    <text x="46" y="198" font-size="10" fill="#4a7a5a">→ Konsultacje na żądanie</text>
    <text x="46" y="216" font-size="10" fill="#4a7a5a">→ Wsparcie przy trudnościach</text>
    <text x="46" y="234" font-size="10" fill="#4a7a5a">→ Przegląd dokumentacji</text>
    <text x="46" y="252" font-size="10" fill="#4a7a5a">→ Przygotowanie do oceny</text>

    <!-- Diminishing bar -->
    <rect x="46" y="272" width="168" height="10" rx="5" fill="#e0ece0"/>
    <rect x="46" y="272" width="84" height="10" rx="5" fill="#2D7D4F" opacity="0.6"/>
    <text x="130" y="296" text-anchor="middle" font-size="9" fill="#2D7D4F">50% intensywności vs. I półrocze</text>
    <text x="130" y="310" text-anchor="middle" font-size="9" fill="#4a7a5a">Mentor zawsze dostępny,</text>
    <text x="130" y="322" text-anchor="middle" font-size="9" fill="#4a7a5a">ale inicjatywa po stronie</text>
    <text x="130" y="334" text-anchor="middle" font-size="9" fill="#2D7D4F">nauczyciela</text>
  </g>

  <!-- Middle: Transition -->
  <g>
    <path d="M 232,240 Q 290,220 330,240 Q 370,260 408,240" stroke="url(#scaleGrad)" stroke-width="2.5" fill="none" stroke-dasharray="6,3"/>
    <text x="320" y="220" text-anchor="middle" font-size="10" fill="#1a3a2a" font-weight="700">PRZEJŚCIE</text>
    <text x="320" y="234" text-anchor="middle" font-size="9" fill="#4a7a5a">coraz więcej</text>
    <text x="320" y="248" text-anchor="middle" font-size="9" fill="#4a7a5a">samodzielności</text>
    <circle cx="320" cy="265" r="18" fill="url(#scaleGrad)" opacity="0.2"/>
    <text x="320" y="270" text-anchor="middle" font-size="18">→</text>
  </g>

  <!-- Right side: Teacher independence -->
  <g filter="url(#sh)">
    <rect x="490" y="130" width="200" height="220" rx="12" fill="white"/>
    <rect x="490" y="130" width="200" height="34" rx="10" fill="#1E6B9E"/>
    <text x="590" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="white">SAMODZIELNOŚĆ</text>
    <text x="590" y="158" text-anchor="middle" font-size="9" fill="#a8d0f0">nauczyciela rośnie</text>

    <text x="506" y="180" font-size="10" fill="#4a6a7a">→ Samodzielne planowanie</text>
    <text x="506" y="198" font-size="10" fill="#4a6a7a">→ Obserwacje innych n-li</text>
    <text x="506" y="216" font-size="10" fill="#4a6a7a">→ Dokumenty awansu/staż</text>
    <text x="506" y="234" font-size="10" fill="#4a6a7a">→ Plan zamknięcia roku</text>
    <text x="506" y="252" font-size="10" fill="#4a6a7a">→ Ocena własnej pracy</text>

    <!-- Growing bar -->
    <rect x="506" y="272" width="168" height="10" rx="5" fill="#d0e4f0"/>
    <rect x="506" y="272" width="134" height="10" rx="5" fill="#1E6B9E" opacity="0.7"/>
    <text x="590" y="296" text-anchor="middle" font-size="9" fill="#1E6B9E">80% samodzielności w Q4</text>
    <text x="590" y="310" text-anchor="middle" font-size="9" fill="#4a6a7a">Dokumentacja awansu</text>
    <text x="590" y="322" text-anchor="middle" font-size="9" fill="#4a6a7a">lub przygotowania</text>
    <text x="590" y="334" text-anchor="middle" font-size="9" fill="#1E6B9E">do zawodu</text>
  </g>

  <!-- Bottom: Key elements -->
  <rect x="30" y="364" width="660" height="22" rx="8" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="360" y="379" text-anchor="middle" font-size="10" fill="#1a3a2a">
    <tspan font-weight="700">Kluczowe dokumenty: </tspan>plan obserwacji · dokumentacja stażu/awansu · checklista zamknięcia roku · podsumowanie mentoringu
  </text>
</svg>
