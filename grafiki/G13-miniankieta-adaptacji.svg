<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4"/>
      <stop offset="100%" style="stop-color:#e8f4fb"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="480" height="400" fill="url(#bg)" rx="16"/>
  <rect width="480" height="5" fill="#2D7D4F" rx="2"/>

  <!-- Header -->
  <rect x="16" y="14" width="448" height="50" rx="10" fill="#2D7D4F"/>
  <text x="240" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="white">SAMOOCENA ADAPTACJI</text>
  <text x="240" y="52" text-anchor="middle" font-size="10" fill="#a8d8bc">Panel diagnostyczny nauczyciela — 4 obszary</text>

  <!-- Radar chart background -->
  <g transform="translate(240, 220)">
    <!-- Grid lines (4 levels) -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#d0e8d8" stroke-width="1" opacity="0.8"/>
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="none" stroke="#d0e8d8" stroke-width="1" opacity="0.6"/>
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="none" stroke="#d0e8d8" stroke-width="1" opacity="0.5"/>
    <polygon points="0,-25 21.7,-12.5 21.7,12.5 0,25 -21.7,12.5 -21.7,-12.5" fill="none" stroke="#d0e8d8" stroke-width="1" opacity="0.4"/>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#b0c8b8" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="86.6" y2="50" stroke="#b0c8b8" stroke-width="1.5" transform="rotate(120)"/>
    <line x1="0" y1="0" x2="86.6" y2="50" stroke="#b0c8b8" stroke-width="1.5" transform="rotate(240)"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#b0c8b8" stroke-width="1.5"/>

    <!-- 4 axes for 4 areas (top, right, bottom, left) -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#b0c8b8" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#b0c8b8" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#b0c8b8" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="-100" y2="0" stroke="#b0c8b8" stroke-width="1" opacity="0.5"/>

    <!-- Data polygon (sample: procedury 80%, klasa 65%, dokumentacja 90%, dobrostan 55%) -->
    <polygon points="0,-80 65,0 0,90 -55,0" fill="#2D7D4F" fill-opacity="0.2" stroke="#2D7D4F" stroke-width="2"/>
    <!-- Dots at vertices -->
    <circle cx="0" cy="-80" r="6" fill="#2D7D4F"/>
    <circle cx="65" cy="0" r="6" fill="#1E6B9E"/>
    <circle cx="0" cy="90" r="6" fill="#3a8a5a"/>
    <circle cx="-55" cy="0" r="6" fill="#d4820a"/>

    <!-- Center -->
    <circle cx="0" cy="0" r="4" fill="white" stroke="#2D7D4F" stroke-width="1.5"/>
  </g>

  <!-- Axis labels -->
  <text x="240" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#2D7D4F">PROCEDURY</text>
  <text x="240" y="118" text-anchor="middle" font-size="9" fill="#4a7a5a">80%</text>

  <text x="360" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#1E6B9E">KLASA</text>
  <text x="360" y="236" text-anchor="middle" font-size="9" fill="#4a6a7a">65%</text>

  <text x="240" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#3a8a5a">DOKUMENTACJA</text>
  <text x="240" y="348" text-anchor="middle" font-size="9" fill="#4a7a5a">90%</text>

  <text x="110" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#d4820a">DOBROSTAN</text>
  <text x="110" y="236" text-anchor="middle" font-size="9" fill="#7a5a2a">55%</text>

  <!-- Scale labels -->
  <text x="248" y="125" font-size="7" fill="#8a9a8a">100</text>
  <text x="248" y="150" font-size="7" fill="#8a9a8a">75</text>
  <text x="248" y="175" font-size="7" fill="#8a9a8a">50</text>
  <text x="248" y="200" font-size="7" fill="#8a9a8a">25</text>

  <!-- Legend / action area -->
  <rect x="16" y="362" width="448" height="28" rx="8" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="240" y="380" text-anchor="middle" font-size="9" fill="#1a3a2a">
    <tspan font-weight="700" fill="#d4820a">⚠ UWAGA: </tspan>Dobrostan poniżej 60% — zaplanuj rozmowę z mentorem w ciągu tygodnia
  </text>
</svg>
