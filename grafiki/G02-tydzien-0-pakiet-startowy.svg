<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4"/>
      <stop offset="100%" style="stop-color:#e8f6ef"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="700" height="420" fill="url(#bg)" rx="16"/>
  <rect width="700" height="5" fill="#2D7D4F" rx="2"/>

  <!-- Header -->
  <rect x="20" y="16" width="660" height="54" rx="10" fill="#2D7D4F"/>
  <text x="350" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="white" letter-spacing="0.5">ETAP 0 · PRZED PIERWSZYM DNIEM</text>
  <text x="350" y="58" text-anchor="middle" font-size="11" fill="#a8d8bc">Pakiet startowy nowego nauczyciela — wszystko, co musisz mieć zanim wejdziesz do szkoły</text>

  <!-- Card 1: Plan dnia -->
  <g filter="url(#sh)">
    <rect x="30" y="88" width="148" height="150" rx="12" fill="white"/>
    <rect x="30" y="88" width="148" height="6" rx="3" fill="#2D7D4F"/>
    <!-- icon: calendar -->
    <rect x="76" y="108" width="56" height="46" rx="6" fill="#e8f6ef"/>
    <rect x="76" y="108" width="56" height="12" rx="3" fill="#2D7D4F"/>
    <line x1="88" y1="128" x2="120" y2="128" stroke="#4a9a6a" stroke-width="2"/>
    <line x1="88" y1="136" x2="120" y2="136" stroke="#4a9a6a" stroke-width="2"/>
    <line x1="88" y1="144" x2="108" y2="144" stroke="#4a9a6a" stroke-width="2"/>
    <text x="104" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">PLAN DNIA</text>
    <text x="104" y="186" text-anchor="middle" font-size="10" fill="#4a7a5a">Grafik, rozkład</text>
    <text x="104" y="200" text-anchor="middle" font-size="10" fill="#4a7a5a">sal i klas</text>
    <rect x="66" y="222" width="76" height="10" rx="4" fill="#2D7D4F" opacity="0.15"/>
    <text x="104" y="231" text-anchor="middle" font-size="8" fill="#2D7D4F">✓ GOTOWE</text>
  </g>

  <!-- Card 2: Kontakt do mentora -->
  <g filter="url(#sh)">
    <rect x="192" y="88" width="148" height="150" rx="12" fill="white"/>
    <rect x="192" y="88" width="148" height="6" rx="3" fill="#3a8a5a"/>
    <!-- icon: person -->
    <circle cx="266" cy="122" r="18" fill="#e8f6ef"/>
    <circle cx="266" cy="118" r="8" fill="#3a8a5a"/>
    <path d="M248,136 Q266,128 284,136" stroke="#3a8a5a" stroke-width="2.5" fill="none"/>
    <text x="266" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">MENTOR</text>
    <text x="266" y="186" text-anchor="middle" font-size="10" fill="#4a7a5a">Imię, nr pokoju</text>
    <text x="266" y="200" text-anchor="middle" font-size="10" fill="#4a7a5a">telefon, e-mail</text>
    <rect x="228" y="222" width="76" height="10" rx="4" fill="#3a8a5a" opacity="0.15"/>
    <text x="266" y="231" text-anchor="middle" font-size="8" fill="#3a8a5a">✓ GOTOWE</text>
  </g>

  <!-- Card 3: Dziennik elektroniczny -->
  <g filter="url(#sh)">
    <rect x="354" y="88" width="148" height="150" rx="12" fill="white"/>
    <rect x="354" y="88" width="148" height="6" rx="3" fill="#1E6B9E"/>
    <!-- icon: screen/laptop -->
    <rect x="400" y="108" width="56" height="38" rx="4" fill="#ddeef8"/>
    <rect x="404" y="112" width="48" height="28" rx="2" fill="#1E6B9E" opacity="0.2"/>
    <line x1="412" y1="120" x2="444" y2="120" stroke="#1E6B9E" stroke-width="1.5"/>
    <line x1="412" y1="126" x2="444" y2="126" stroke="#1E6B9E" stroke-width="1.5"/>
    <line x1="412" y1="132" x2="434" y2="132" stroke="#1E6B9E" stroke-width="1.5"/>
    <rect x="412" y="146" width="32" height="4" rx="2" fill="#1E6B9E" opacity="0.3"/>
    <text x="428" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">DZIENNIK</text>
    <text x="428" y="186" text-anchor="middle" font-size="10" fill="#4a6a7a">Login, hasło</text>
    <text x="428" y="200" text-anchor="middle" font-size="10" fill="#4a6a7a">instrukcja dostępu</text>
    <rect x="390" y="222" width="76" height="10" rx="4" fill="#1E6B9E" opacity="0.15"/>
    <text x="428" y="231" text-anchor="middle" font-size="8" fill="#1E6B9E">✓ GOTOWE</text>
  </g>

  <!-- Card 4: Klucze i sale -->
  <g filter="url(#sh)">
    <rect x="516" y="88" width="148" height="150" rx="12" fill="white"/>
    <rect x="516" y="88" width="148" height="6" rx="3" fill="#d4820a"/>
    <!-- icon: key -->
    <circle cx="590" cy="120" r="16" fill="#fff3e0" stroke="#d4820a" stroke-width="2.5"/>
    <circle cx="590" cy="120" r="7" fill="none" stroke="#d4820a" stroke-width="2.5"/>
    <line x1="601" y1="131" x2="614" y2="144" stroke="#d4820a" stroke-width="3" stroke-linecap="round"/>
    <line x1="608" y1="140" x2="612" y2="136" stroke="#d4820a" stroke-width="2"/>
    <line x1="611" y1="143" x2="615" y2="139" stroke="#d4820a" stroke-width="2"/>
    <text x="590" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">KLUCZE</text>
    <text x="590" y="186" text-anchor="middle" font-size="10" fill="#7a5a2a">Numer klucza</text>
    <text x="590" y="200" text-anchor="middle" font-size="10" fill="#7a5a2a">numery sal</text>
    <rect x="552" y="222" width="76" height="10" rx="4" fill="#d4820a" opacity="0.15"/>
    <text x="590" y="231" text-anchor="middle" font-size="8" fill="#d4820a">✓ GOTOWE</text>
  </g>

  <!-- Bottom checklist -->
  <rect x="30" y="258" width="640" height="140" rx="12" fill="white" filter="url(#sh)"/>
  <rect x="30" y="258" width="640" height="6" rx="3" fill="#2D7D4F" opacity="0.5"/>
  <text x="350" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a2a">CHECKLISTA PRZED PIERWSZYM DNIEM</text>

  <!-- Checklist items in 2 columns -->
  <rect x="52" y="294" width="14" height="14" rx="3" fill="#2D7D4F"/>
  <text x="63" y="305" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="75" y="305" font-size="11" fill="#1a3a2a">Odebrałem/am kartę i klucze do szkoły</text>

  <rect x="52" y="316" width="14" height="14" rx="3" fill="#2D7D4F"/>
  <text x="63" y="327" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="75" y="327" font-size="11" fill="#1a3a2a">Znam numer pokoju i kontakt do mentora</text>

  <rect x="52" y="338" width="14" height="14" rx="3" fill="#2D7D4F"/>
  <text x="63" y="349" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="75" y="349" font-size="11" fill="#1a3a2a">Mam login do dziennika elektronicznego</text>

  <rect x="52" y="360" width="14" height="14" rx="3" fill="#2D7D4F"/>
  <text x="63" y="371" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="75" y="371" font-size="11" fill="#1a3a2a">Zapoznałem/am się z planem zajęć</text>

  <rect x="372" y="294" width="14" height="14" rx="3" fill="#1E6B9E"/>
  <text x="383" y="305" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="395" y="305" font-size="11" fill="#1a3a2a">Mam dostęp do poczty szkolnej</text>

  <rect x="372" y="316" width="14" height="14" rx="3" fill="#1E6B9E"/>
  <text x="383" y="327" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="395" y="327" font-size="11" fill="#1a3a2a">Wiem, gdzie zgłaszać nieobecności</text>

  <rect x="372" y="338" width="14" height="14" rx="3" fill="#1E6B9E"/>
  <text x="383" y="349" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="395" y="349" font-size="11" fill="#1a3a2a">Znam procedurę wypadkową i p.poż.</text>

  <rect x="372" y="360" width="14" height="14" rx="3" fill="#1E6B9E"/>
  <text x="383" y="371" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="395" y="371" font-size="11" fill="#1a3a2a">Ustaliłem/am termin 1. spotkania z mentorem</text>
</svg>
