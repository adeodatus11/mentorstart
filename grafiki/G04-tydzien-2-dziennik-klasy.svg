<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e4eef8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="700" height="400" fill="url(#bg)" rx="16"/>
  <rect width="700" height="5" fill="#1E6B9E" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="660" height="54" rx="10" fill="#1E6B9E"/>
  <text x="350" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">ETAP 2 · DZIENNIK I PIERWSZE KLASY</text>
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#a8d0f0">Kontrola rytmu pracy — tematy, obecności, klasy, wychowawca</text>

  <!-- Main dashboard frame -->
  <rect x="30" y="86" width="640" height="200" rx="12" fill="white" filter="url(#sh)"/>
  <rect x="30" y="86" width="640" height="36" rx="12" fill="#1E6B9E" opacity="0.9"/>
  <rect x="30" y="108" width="640" height="14" fill="#1E6B9E" opacity="0.9"/>
  <text x="350" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="white">DASHBOARD DZIENNIKA ELEKTRONICZNEGO</text>

  <!-- Status indicators -->
  <!-- Tematy -->
  <rect x="52" y="138" width="140" height="120" rx="8" fill="#f0f7f4"/>
  <text x="122" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#2D7D4F">TEMATY LEKCJI</text>
  <!-- Progress bar -->
  <rect x="62" y="172" width="120" height="10" rx="5" fill="#d8ead8"/>
  <rect x="62" y="172" width="96" height="10" rx="5" fill="#2D7D4F"/>
  <text x="122" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#2D7D4F">80%</text>
  <text x="122" y="212" text-anchor="middle" font-size="9" fill="#4a7a5a">uzupełnione</text>
  <rect x="72" y="224" width="100" height="26" rx="6" fill="#2D7D4F" opacity="0.1"/>
  <text x="122" y="241" text-anchor="middle" font-size="9" fill="#2D7D4F">⚠ Sprawdź 4 klasy</text>

  <!-- Obecności -->
  <rect x="208" y="138" width="140" height="120" rx="8" fill="#f0f4f8"/>
  <text x="278" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1E6B9E">OBECNOŚCI</text>
  <rect x="218" y="172" width="120" height="10" rx="5" fill="#d0e4f4"/>
  <rect x="218" y="172" width="114" height="10" rx="5" fill="#1E6B9E"/>
  <text x="278" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#1E6B9E">95%</text>
  <text x="278" y="212" text-anchor="middle" font-size="9" fill="#4a6a7a">uzupełnione</text>
  <rect x="228" y="224" width="100" height="26" rx="6" fill="#1E6B9E" opacity="0.1"/>
  <text x="278" y="241" text-anchor="middle" font-size="9" fill="#1E6B9E">✓ Bieżące</text>

  <!-- Oceny -->
  <rect x="364" y="138" width="140" height="120" rx="8" fill="#fdf8f0"/>
  <text x="434" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#d4820a">PIERWSZE OCENY</text>
  <rect x="374" y="172" width="120" height="10" rx="5" fill="#f4e0b8"/>
  <rect x="374" y="172" width="60" height="10" rx="5" fill="#d4820a"/>
  <text x="434" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#d4820a">50%</text>
  <text x="434" y="212" text-anchor="middle" font-size="9" fill="#7a5a2a">klas z oceną</text>
  <rect x="384" y="224" width="100" height="26" rx="6" fill="#d4820a" opacity="0.1"/>
  <text x="434" y="241" text-anchor="middle" font-size="9" fill="#d4820a">➜ Uzupełnij resztę</text>

  <!-- Wychowawca -->
  <rect x="520" y="138" width="126" height="120" rx="8" fill="#f4f0f8"/>
  <text x="583" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a9a">WYCHOWAWCA</text>
  <circle cx="583" cy="192" r="20" fill="#ece0f4"/>
  <circle cx="583" cy="186" r="9" fill="#7a4a9a"/>
  <path d="M563,206 Q583,196 603,206" stroke="#7a4a9a" stroke-width="2" fill="none"/>
  <text x="583" y="222" text-anchor="middle" font-size="9" fill="#5a3a7a">Klasy do przejęcia</text>
  <rect x="546" y="232" width="74" height="18" rx="6" fill="#7a4a9a" opacity="0.1"/>
  <text x="583" y="244" text-anchor="middle" font-size="8" fill="#7a4a9a">➜ Poznaj listę</text>

  <!-- Bottom action row -->
  <rect x="30" y="300" width="300" height="76" rx="12" fill="white" filter="url(#sh)"/>
  <rect x="30" y="300" width="300" height="5" rx="2" fill="#2D7D4F" opacity="0.6"/>
  <text x="180" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">ZADANIA NA TYDZIEŃ 2</text>
  <text x="52" y="342" font-size="10" fill="#2D7D4F">✓</text><text x="62" y="342" font-size="10" fill="#1a3a2a">Uzupełnij brakujące tematy</text>
  <text x="52" y="358" font-size="10" fill="#2D7D4F">✓</text><text x="62" y="358" font-size="10" fill="#1a3a2a">Wpisz pierwsze oceny bieżące</text>
  <text x="52" y="374" font-size="10" fill="#2D7D4F">✓</text><text x="62" y="374" font-size="10" fill="#1a3a2a">Sprawdź listę klas z wychowawcą</text>

  <rect x="350" y="300" width="320" height="76" rx="12" fill="white" filter="url(#sh)"/>
  <rect x="350" y="300" width="320" height="5" rx="2" fill="#1E6B9E" opacity="0.6"/>
  <text x="510" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3a2a">SPOTKANIE Z MENTOREM</text>
  <text x="372" y="342" font-size="10" fill="#1E6B9E">→</text><text x="382" y="342" font-size="10" fill="#1a3a2a">Omów stan dziennika</text>
  <text x="372" y="358" font-size="10" fill="#1E6B9E">→</text><text x="382" y="358" font-size="10" fill="#1a3a2a">Podziel się trudnościami z klasami</text>
  <text x="372" y="374" font-size="10" fill="#1E6B9E">→</text><text x="382" y="374" font-size="10" fill="#1a3a2a">Ustal plan na kolejny tydzień</text>
</svg>
