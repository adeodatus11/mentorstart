<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e4eef8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1E6B9E"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="url(#bg)" rx="16"/>
  <rect width="700" height="5" fill="#1E6B9E" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="660" height="54" rx="10" fill="#1E6B9E"/>
  <text x="350" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">MIESIĄC 2 · OBSERWACJE I INFORMACJA ZWROTNA</text>
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#a8d0f0">Cykl rozwojowy nauczyciela: obserwacja → rozmowa → działanie → sprawdzenie</text>

  <!-- Cycle arrows (large circular flow) -->
  <!-- Large circle background -->
  <circle cx="350" cy="230" r="140" fill="none" stroke="#1E6B9E" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.3"/>

  <!-- 4 nodes of the cycle -->
  <!-- Node 1: OBSERWACJA (top) -->
  <g filter="url(#sh)">
    <circle cx="350" cy="100" r="50" fill="#1E6B9E"/>
    <circle cx="350" cy="100" r="42" fill="white" opacity="0.1"/>
    <text x="350" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="white">OBSERWACJA</text>
    <text x="350" y="110" text-anchor="middle" font-size="10" fill="#c0daf8">LEKCJI</text>
  </g>

  <!-- Node 2: ROZMOWA (right) -->
  <g filter="url(#sh)">
    <circle cx="490" cy="230" r="50" fill="#2D7D4F"/>
    <circle cx="490" cy="230" r="42" fill="white" opacity="0.1"/>
    <text x="490" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="white">ROZMOWA</text>
    <text x="490" y="240" text-anchor="middle" font-size="10" fill="#a8d8bc">MENTORSKA</text>
  </g>

  <!-- Node 3: DZIAŁANIE (bottom) -->
  <g filter="url(#sh)">
    <circle cx="350" cy="360" r="50" fill="#3a8a5a"/>
    <circle cx="350" cy="360" r="42" fill="white" opacity="0.1"/>
    <text x="350" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="white">DZIAŁANIE</text>
    <text x="350" y="370" text-anchor="middle" font-size="10" fill="#c0e8d0">CEL ROZWOJOWY</text>
  </g>

  <!-- Node 4: SPRAWDZENIE (left) -->
  <g filter="url(#sh)">
    <circle cx="210" cy="230" r="50" fill="#165a8e"/>
    <circle cx="210" cy="230" r="42" fill="white" opacity="0.1"/>
    <text x="210" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="white">SPRAWDZENIE</text>
    <text x="210" y="240" text-anchor="middle" font-size="10" fill="#a8c8e8">POSTĘPÓW</text>
  </g>

  <!-- Curved arrows between nodes -->
  <!-- Top to Right -->
  <path d="M 395,130 Q 460,160 470,182" stroke="#1E6B9E" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <!-- Right to Bottom -->
  <path d="M 470,278 Q 450,320 400,348" stroke="#2D7D4F" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <!-- Bottom to Left -->
  <path d="M 302,358 Q 248,340 228,278" stroke="#3a8a5a" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <!-- Left to Top -->
  <path d="M 228,184 Q 260,140 302,118" stroke="#165a8e" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>

  <!-- Detail labels on arrows -->
  <rect x="430" y="148" width="70" height="22" rx="4" fill="white" opacity="0.9"/>
  <text x="465" y="163" text-anchor="middle" font-size="9" fill="#1E6B9E">formularz obs.</text>

  <rect x="454" y="298" width="62" height="22" rx="4" fill="white" opacity="0.9"/>
  <text x="485" y="313" text-anchor="middle" font-size="9" fill="#2D7D4F">plan działania</text>

  <rect x="214" y="330" width="72" height="22" rx="4" fill="white" opacity="0.9"/>
  <text x="250" y="345" text-anchor="middle" font-size="9" fill="#3a8a5a">cel i termin</text>

  <rect x="196" y="138" width="72" height="22" rx="4" fill="white" opacity="0.9"/>
  <text x="232" y="153" text-anchor="middle" font-size="9" fill="#165a8e">wyniki po 2 tyg.</text>

  <!-- Center label -->
  <circle cx="350" cy="230" r="30" fill="white" filter="url(#sh)"/>
  <text x="350" y="226" text-anchor="middle" font-size="9" font-weight="700" fill="#1E6B9E">CYKL</text>
  <text x="350" y="238" text-anchor="middle" font-size="9" fill="#1E6B9E">ROZWOJU</text>

  <!-- Details boxes outside cycle (minimal) -->
  <!-- Below header - details per step -->
  <!-- Observation details -->
  <rect x="24" y="76" width="120" height="46" rx="6" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="84" y="92" text-anchor="middle" font-size="8" font-weight="700" fill="#1E6B9E">OBSERWACJA</text>
  <text x="84" y="106" text-anchor="middle" font-size="8" fill="#4a6a7a">Plan · formularz</text>
  <text x="84" y="118" text-anchor="middle" font-size="8" fill="#4a6a7a">notatka po lekcji</text>

  <rect x="556" y="76" width="120" height="46" rx="6" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="616" y="92" text-anchor="middle" font-size="8" font-weight="700" fill="#2D7D4F">ROZMOWA</text>
  <text x="616" y="106" text-anchor="middle" font-size="8" fill="#4a7a5a">Informacja zwrotna</text>
  <text x="616" y="118" text-anchor="middle" font-size="8" fill="#4a7a5a">bez oceniania osoby</text>

  <rect x="556" y="352" width="120" height="46" rx="6" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="616" y="368" text-anchor="middle" font-size="8" font-weight="700" fill="#3a8a5a">DZIAŁANIE</text>
  <text x="616" y="382" text-anchor="middle" font-size="8" fill="#4a7a5a">1 konkretny cel</text>
  <text x="616" y="394" text-anchor="middle" font-size="8" fill="#4a7a5a">z terminem realizacji</text>

  <rect x="24" y="352" width="120" height="46" rx="6" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="84" y="368" text-anchor="middle" font-size="8" font-weight="700" fill="#165a8e">SPRAWDZENIE</text>
  <text x="84" y="382" text-anchor="middle" font-size="8" fill="#4a6a7a">Kolejna obserwacja</text>
  <text x="84" y="394" text-anchor="middle" font-size="8" fill="#4a6a7a">lub rozmowa po 2 tyg.</text>
</svg>
