<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f2ee"/>
      <stop offset="100%" style="stop-color:#eef4f0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="760" height="440" fill="url(#bg)" rx="16"/>
  <rect width="760" height="5" fill="#1a3a2a" rx="2"/>
  <rect x="0" y="5" width="760" height="3" fill="#e8a020"/>

  <!-- Header -->
  <rect x="16" y="14" width="728" height="58" rx="10" fill="#1a3a2a"/>
  <text x="380" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white" letter-spacing="0.5">SPECYFIKA SZKOŁY ZAWODOWEJ</text>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#a8b8a0">Nauczyciel w ZSZ — pracownie, BHP, egzaminy zawodowe, praktyki</text>
  <text x="380" y="68" text-anchor="middle" font-size="9" fill="#e8a020">Dodaj po potwierdzeniu zakresu ze szkołą</text>

  <!-- 5 domain cards -->

  <!-- Card 1: Pracownie zawodowe -->
  <g filter="url(#sh)">
    <rect x="20" y="92" width="220" height="160" rx="12" fill="white"/>
    <rect x="20" y="92" width="220" height="42" rx="10" fill="#1a3a2a"/>
    <text x="130" y="109" text-anchor="middle" font-size="22">🔧</text>
    <text x="200" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="white">PRACOWNIE</text>
    <text x="200" y="122" text-anchor="middle" font-size="9" fill="#a8b8a0">zawodowe</text>
    <text x="36" y="152" font-size="9" fill="#1a3a2a">→ Regulamin pracowni</text>
    <text x="36" y="167" font-size="9" fill="#1a3a2a">→ Lista wyposażenia i sprzętu</text>
    <text x="36" y="182" font-size="9" fill="#1a3a2a">→ Odpowiedzialność za sprzęt</text>
    <text x="36" y="197" font-size="9" fill="#1a3a2a">→ Harmonogram pracowni</text>
    <text x="36" y="212" font-size="9" fill="#1a3a2a">→ Dostęp do materiałów</text>
    <rect x="30" y="226" width="200" height="18" rx="6" fill="#1a3a2a" opacity="0.08"/>
    <text x="130" y="239" text-anchor="middle" font-size="8" fill="#1a3a2a">Klucz do pracowni: sekretariat</text>
  </g>

  <!-- Card 2: BHP -->
  <g filter="url(#sh)">
    <rect x="256" y="92" width="220" height="160" rx="12" fill="white"/>
    <rect x="256" y="92" width="220" height="42" rx="10" fill="#c0392b"/>
    <text x="366" y="109" text-anchor="middle" font-size="22">⛑️</text>
    <text x="420" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="white">BEZPIECZEŃSTWO</text>
    <text x="420" y="122" text-anchor="middle" font-size="9" fill="#f4c0b8">BHP w pracowniach</text>
    <text x="272" y="152" font-size="9" fill="#1a3a2a">→ Szkolenie BHP dla n-la</text>
    <text x="272" y="167" font-size="9" fill="#1a3a2a">→ Zapoznanie uczniów z BHP</text>
    <text x="272" y="182" font-size="9" fill="#1a3a2a">→ Środki ochrony indyw. (ŚOI)</text>
    <text x="272" y="197" font-size="9" fill="#1a3a2a">→ Procedura wypadkowa</text>
    <text x="272" y="212" font-size="9" fill="#1a3a2a">→ Apteczka — lokalizacja</text>
    <rect x="266" y="226" width="200" height="18" rx="6" fill="#c0392b" opacity="0.08"/>
    <text x="366" y="239" text-anchor="middle" font-size="8" fill="#c0392b">Instrukcja BHP podpisana przez uczniów</text>
  </g>

  <!-- Card 3: Egzaminy zawodowe -->
  <g filter="url(#sh)">
    <rect x="492" y="92" width="248" height="160" rx="12" fill="white"/>
    <rect x="492" y="92" width="248" height="42" rx="10" fill="#1E6B9E"/>
    <text x="616" y="109" text-anchor="middle" font-size="22">📝</text>
    <text x="680" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="white">EGZAMINY</text>
    <text x="680" y="122" text-anchor="middle" font-size="9" fill="#a8d0f4">zawodowe CKE</text>
    <text x="508" y="152" font-size="9" fill="#1a3a2a">→ Kwalifikacje zawodowe (KZ)</text>
    <text x="508" y="167" font-size="9" fill="#1a3a2a">→ Harmonogram egzaminów CKE</text>
    <text x="508" y="182" font-size="9" fill="#1a3a2a">→ Dostosowania na egzaminie</text>
    <text x="508" y="197" font-size="9" fill="#1a3a2a">→ Wsparcie uczniów w przygot.</text>
    <text x="508" y="212" font-size="9" fill="#1a3a2a">→ Koordynator egzaminów</text>
    <rect x="502" y="226" width="228" height="18" rx="6" fill="#1E6B9E" opacity="0.08"/>
    <text x="616" y="239" text-anchor="middle" font-size="8" fill="#1E6B9E">Zapytaj koordynatora o terminy i dokumenty</text>
  </g>

  <!-- Card 4: Praktyki zawodowe -->
  <g filter="url(#sh)">
    <rect x="20" y="270" width="336" height="148" rx="12" fill="white"/>
    <rect x="20" y="270" width="336" height="38" rx="10" fill="#3a8a5a"/>
    <text x="188" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="white">🏭 PRAKTYKI ZAWODOWE</text>
    <text x="188" y="301" text-anchor="middle" font-size="9" fill="#a8d8bc">Uczniowie w zakładach pracy</text>

    <text x="36" y="326" font-size="9" fill="#1a3a2a">→ Lista zakładów praktyk</text>
    <text x="36" y="342" font-size="9" fill="#1a3a2a">→ Opiekun praktyk ze szkoły</text>
    <text x="36" y="358" font-size="9" fill="#1a3a2a">→ Dokumentacja (dziennik praktyk)</text>
    <text x="220" y="326" font-size="9" fill="#1a3a2a">→ Ocena praktyk</text>
    <text x="220" y="342" font-size="9" fill="#1a3a2a">→ Kontakt z pracodawcą</text>
    <text x="220" y="358" font-size="9" fill="#1a3a2a">→ BHP u pracodawcy</text>
    <rect x="30" y="370" width="316" height="40" rx="6" fill="#3a8a5a" opacity="0.08"/>
    <text x="188" y="388" text-anchor="middle" font-size="9" font-weight="700" fill="#3a8a5a">Nauczyciel odwiedza zakład min. 1× w trakcie praktyk</text>
    <text x="188" y="402" text-anchor="middle" font-size="8" fill="#4a7a5a">Formularz wizyty dostępny u koordynatora praktyk</text>
  </g>

  <!-- Card 5: Specyfika uczniów ZSZ -->
  <g filter="url(#sh)">
    <rect x="372" y="270" width="368" height="148" rx="12" fill="white"/>
    <rect x="372" y="270" width="368" height="38" rx="10" fill="#8a4a9a"/>
    <text x="556" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="white">👩‍🔧 UCZNIOWIE W DZIAŁANIU</text>
    <text x="556" y="301" text-anchor="middle" font-size="9" fill="#d0a8e0">Specyfika pracy w szkole zawodowej</text>

    <text x="388" y="326" font-size="9" fill="#1a3a2a">→ Motywacja: praktyczna, nie teoretyczna</text>
    <text x="388" y="342" font-size="9" fill="#1a3a2a">→ Zróżnicowane ścieżki edukacyjne</text>
    <text x="388" y="358" font-size="9" fill="#1a3a2a">→ Uczniowie z orzeczeniami — plan dostosowań</text>
    <text x="388" y="374" font-size="9" fill="#1a3a2a">→ Absencje podczas praktyk — odrębna procedura</text>
    <text x="388" y="390" font-size="9" fill="#1a3a2a">→ Nagrody i wyróżnienia zawodowe — motywacja</text>
    <rect x="382" y="398" width="348" height="14" rx="4" fill="#8a4a9a" opacity="0.08"/>
    <text x="556" y="410" text-anchor="middle" font-size="8" fill="#8a4a9a">Zapytaj mentora o historię klasy i specyfikę zawodu</text>
  </g>

  <!-- Bottom note -->
  <rect x="20" y="432" width="720" height="4" rx="2" fill="#e8a020" opacity="0.4"/>
</svg>
