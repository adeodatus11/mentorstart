<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f4"/>
      <stop offset="100%" style="stop-color:#fef4f0"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2D7D4F"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1E6B9E"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d4820a"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <rect width="800" height="5" fill="#c0392b" rx="2"/>

  <!-- Header -->
  <rect x="20" y="12" width="760" height="52" rx="10" fill="#c0392b"/>
  <text x="400" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="white">PROCEDURY SZYBKIEJ REAKCJI — FLOWCHART</text>
  <text x="400" y="52" text-anchor="middle" font-size="10" fill="#f4c0b8">3 warianty: trudna klasa · trudny rodzic · uczeń w kryzysie | Kroki: fakt → reakcja → eskalacja → dokumentacja</text>

  <!-- Universal first step -->
  <g filter="url(#sh)">
    <rect x="300" y="82" width="200" height="40" rx="20" fill="#c0392b"/>
    <text x="400" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="white">OBSERWUJESZ PROBLEM</text>
    <text x="400" y="113" text-anchor="middle" font-size="9" fill="#fad0c8">Zatrzymaj się — opisz fakt, nie ocenę</text>
  </g>

  <!-- Branch lines -->
  <line x1="300" y1="102" x2="136" y2="156" stroke="#2D7D4F" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="400" y1="122" x2="400" y2="154" stroke="#d4820a" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="500" y1="102" x2="664" y2="156" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Branch labels -->
  <text x="190" y="144" text-anchor="middle" font-size="9" fill="#2D7D4F" font-weight="700">TRUDNA KLASA</text>
  <text x="400" y="148" text-anchor="middle" font-size="9" fill="#d4820a" font-weight="700">TRUDNY RODZIC</text>
  <text x="606" y="144" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="700">UCZEŃ W KRYZYSIE</text>

  <!-- === COLUMN 1: TRUDNA KLASA === -->
  <!-- Step A1 -->
  <g filter="url(#sh)">
    <rect x="30" y="158" width="210" height="60" rx="8" fill="white"/>
    <rect x="30" y="158" width="210" height="6" rx="3" fill="#2D7D4F"/>
    <text x="135" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 1: ZABEZPIECZ KLASĘ</text>
    <text x="46" y="194" font-size="9" fill="#4a7a5a">● Utrzymaj spokój, ton głosu</text>
    <text x="46" y="207" font-size="9" fill="#4a7a5a">● Opisz co widzisz (nie oceniaj)</text>
  </g>
  <line x1="135" y1="218" x2="135" y2="246" stroke="#2D7D4F" stroke-width="1.5" marker-end="url(#arrG)"/>
  <!-- Step A2 -->
  <g filter="url(#sh)">
    <rect x="30" y="248" width="210" height="60" rx="8" fill="white"/>
    <rect x="30" y="248" width="210" height="6" rx="3" fill="#3a8a5a"/>
    <text x="135" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 2: WŁĄCZ MENTORA</text>
    <text x="46" y="284" font-size="9" fill="#4a7a5a">● Poinformuj tego samego dnia</text>
    <text x="46" y="297" font-size="9" fill="#4a7a5a">● Opisz zdarzenie pisemnie</text>
  </g>
  <line x1="135" y1="308" x2="135" y2="336" stroke="#3a8a5a" stroke-width="1.5" marker-end="url(#arrG)"/>
  <!-- Step A3 -->
  <g filter="url(#sh)">
    <rect x="30" y="338" width="210" height="60" rx="8" fill="white"/>
    <rect x="30" y="338" width="210" height="6" rx="3" fill="#4a9a6a"/>
    <text x="135" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 3: ESKALACJA</text>
    <text x="46" y="374" font-size="9" fill="#4a7a5a">● Wychowawca klasy</text>
    <text x="46" y="387" font-size="9" fill="#4a7a5a">● Pedagog / dyrekcja</text>
  </g>

  <!-- === COLUMN 2: TRUDNY RODZIC === -->
  <!-- Step B1 -->
  <g filter="url(#sh)">
    <rect x="295" y="158" width="210" height="60" rx="8" fill="white"/>
    <rect x="295" y="158" width="210" height="6" rx="3" fill="#d4820a"/>
    <text x="400" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 1: WYSŁUCHAJ</text>
    <text x="311" y="194" font-size="9" fill="#7a5a2a">● Aktywne słuchanie, notatki</text>
    <text x="311" y="207" font-size="9" fill="#7a5a2a">● Nie obiecuj, nie przepraszaj</text>
  </g>
  <line x1="400" y1="218" x2="400" y2="246" stroke="#d4820a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <!-- Step B2 -->
  <g filter="url(#sh)">
    <rect x="295" y="248" width="210" height="60" rx="8" fill="white"/>
    <rect x="295" y="248" width="210" height="6" rx="3" fill="#d4820a" opacity="0.8"/>
    <text x="400" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 2: MENTOR + WYCHOWAWCA</text>
    <text x="311" y="284" font-size="9" fill="#7a5a2a">● Zaproś do wspólnego spotkania</text>
    <text x="311" y="297" font-size="9" fill="#7a5a2a">● Nie ustalaj sam/a rozwiązania</text>
  </g>
  <line x1="400" y1="308" x2="400" y2="336" stroke="#d4820a" stroke-width="1.5" marker-end="url(#arrO)"/>
  <!-- Step B3 -->
  <g filter="url(#sh)">
    <rect x="295" y="338" width="210" height="60" rx="8" fill="white"/>
    <rect x="295" y="338" width="210" height="6" rx="3" fill="#e8a020"/>
    <text x="400" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 3: ESKALACJA</text>
    <text x="311" y="374" font-size="9" fill="#7a5a2a">● Dyrekcja (jeśli konflikt)</text>
    <text x="311" y="387" font-size="9" fill="#7a5a2a">● Dokumentacja rozmowy</text>
  </g>

  <!-- === COLUMN 3: UCZEŃ W KRYZYSIE === -->
  <!-- Step C1 -->
  <g filter="url(#sh)">
    <rect x="560" y="158" width="210" height="60" rx="8" fill="white"/>
    <rect x="560" y="158" width="210" height="6" rx="3" fill="#c0392b"/>
    <text x="665" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 1: BEZPIECZEŃSTWO</text>
    <text x="576" y="194" font-size="9" fill="#7a2a2a">● Odsuń ucznia od grupy</text>
    <text x="576" y="207" font-size="9" fill="#7a2a2a">● Mów spokojnie, słuchaj</text>
  </g>
  <line x1="665" y1="218" x2="665" y2="246" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <!-- Step C2 -->
  <g filter="url(#sh)">
    <rect x="560" y="248" width="210" height="60" rx="8" fill="white"/>
    <rect x="560" y="248" width="210" height="6" rx="3" fill="#e0352b"/>
    <text x="665" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 2: PEDAGOG / PSYCHOLOG</text>
    <text x="576" y="284" font-size="9" fill="#7a2a2a">● Wezwij specjalistę natychmiast</text>
    <text x="576" y="297" font-size="9" fill="#7a2a2a">● Powiadom wychowawcę</text>
  </g>
  <line x1="665" y1="308" x2="665" y2="336" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <!-- Step C3 -->
  <g filter="url(#sh)">
    <rect x="560" y="338" width="210" height="60" rx="8" fill="white"/>
    <rect x="560" y="338" width="210" height="6" rx="3" fill="#c0392b" opacity="0.7"/>
    <text x="665" y="358" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KROK 3: ESKALACJA</text>
    <text x="576" y="374" font-size="9" fill="#7a2a2a">● Dyrekcja + rodzic (tego dnia)</text>
    <text x="576" y="387" font-size="9" fill="#c0392b">● Pogotowie (jeśli zagrożenie życia)</text>
  </g>

  <!-- Universal last step: DOKUMENTUJ -->
  <line x1="135" y1="398" x2="400" y2="438" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="398" x2="400" y2="438" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="665" y1="398" x2="400" y2="438" stroke="#1a3a2a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <g filter="url(#sh)">
    <rect x="220" y="440" width="360" height="46" rx="12" fill="#1a3a2a"/>
    <text x="400" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="white">ZAWSZE NA KOŃCU: DOKUMENTUJ</text>
    <text x="400" y="476" text-anchor="middle" font-size="9.5" fill="#c0c8c0">Zapisz fakty w dzienniku wdrożenia · Poinformuj mentora · Zachowaj spokój</text>
  </g>
</svg>
