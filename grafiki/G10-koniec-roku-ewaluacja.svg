<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf8ef"/>
      <stop offset="100%" style="stop-color:#f8f4ea"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2D7D4F"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="url(#bg)" rx="16"/>
  <rect width="720" height="5" fill="#e8a020" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="680" height="54" rx="10" fill="#b07010"/>
  <text x="360" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">KONIEC ROKU · ZAMKNIĘCIE I EWALUACJA</text>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#f4d89c">Pętla uczenia się organizacji — zamknij, oceń, zaplanuj kolejny rok</text>

  <!-- Big loop graphic: 4 steps in a horizontal flow with loop-back -->

  <!-- Step 1: ZAMKNIĘCIE -->
  <g filter="url(#sh)">
    <rect x="30" y="90" width="148" height="260" rx="12" fill="white"/>
    <rect x="30" y="90" width="148" height="40" rx="10" fill="#2D7D4F"/>
    <text x="104" y="107" text-anchor="middle" font-size="10" font-weight="700" fill="white">1. ZAMKNIĘCIE</text>
    <text x="104" y="120" text-anchor="middle" font-size="9" fill="#a8d8bc">dokumentacji</text>

    <text x="44" y="148" font-size="9" fill="#4a7a5a">☐ Wszystkie oceny roczne</text>
    <text x="44" y="164" font-size="9" fill="#4a7a5a">☐ Tematy kompletne</text>
    <text x="44" y="180" font-size="9" fill="#4a7a5a">☐ Obecności zamknięte</text>
    <text x="44" y="196" font-size="9" fill="#4a7a5a">☐ Dziennik papierowy</text>
    <text x="44" y="212" font-size="9" fill="#4a7a5a">☐ Arkusze ocen</text>
    <text x="44" y="228" font-size="9" fill="#4a7a5a">☐ Protokoły egzaminów</text>
    <text x="44" y="244" font-size="9" fill="#4a7a5a">☐ Dokumenty awansu</text>
    <circle cx="104" cy="318" r="22" fill="#2D7D4F" opacity="0.1"/>
    <text x="104" y="314" text-anchor="middle" font-size="22">📁</text>
    <text x="104" y="336" text-anchor="middle" font-size="9" fill="#2D7D4F">do archiwum</text>
  </g>

  <!-- Arrow 1→2 -->
  <path d="M178,220 L216,220" stroke="#2D7D4F" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- Step 2: OCENA ROCZNA -->
  <g filter="url(#sh)">
    <rect x="218" y="90" width="148" height="260" rx="12" fill="white"/>
    <rect x="218" y="90" width="148" height="40" rx="10" fill="#1E6B9E"/>
    <text x="292" y="107" text-anchor="middle" font-size="10" font-weight="700" fill="white">2. OCENA ROCZNA</text>
    <text x="292" y="120" text-anchor="middle" font-size="9" fill="#a8d0f4">postępów nauczyciela</text>

    <text x="232" y="148" font-size="9" fill="#4a6a7a">● Rozmowa mentora</text>
    <text x="232" y="164" font-size="9" fill="#4a6a7a">  z nauczycielem</text>
    <text x="232" y="184" font-size="9" fill="#4a6a7a">● Ocena 4 obszarów:</text>
    <text x="240" y="200" font-size="9" fill="#4a6a7a">- dydaktyka</text>
    <text x="240" y="216" font-size="9" fill="#4a6a7a">- dokumentacja</text>
    <text x="240" y="232" font-size="9" fill="#4a6a7a">- relacje z uczniami</text>
    <text x="240" y="248" font-size="9" fill="#4a6a7a">- samorozwój</text>
    <circle cx="292" cy="318" r="22" fill="#1E6B9E" opacity="0.1"/>
    <text x="292" y="314" text-anchor="middle" font-size="22">⭐</text>
    <text x="292" y="336" text-anchor="middle" font-size="9" fill="#1E6B9E">ocena i feedback</text>
  </g>

  <!-- Arrow 2→3 -->
  <path d="M366,220 L404,220" stroke="#1E6B9E" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- Step 3: PODSUMOWANIE MENTORINGU -->
  <g filter="url(#sh)">
    <rect x="406" y="90" width="148" height="260" rx="12" fill="white"/>
    <rect x="406" y="90" width="148" height="40" rx="10" fill="#3a8a5a"/>
    <text x="480" y="107" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">3. PODSUMOWANIE</text>
    <text x="480" y="120" text-anchor="middle" font-size="9" fill="#a8d8c0">mentoringu</text>

    <text x="420" y="148" font-size="9" fill="#4a7a5a">● Co się udało</text>
    <text x="420" y="164" font-size="9" fill="#4a7a5a">● Co było trudne</text>
    <text x="420" y="180" font-size="9" fill="#4a7a5a">● Wnioski dla szkoły</text>
    <text x="420" y="200" font-size="9" fill="#4a7a5a">● Rekomendacje dla</text>
    <text x="428" y="216" font-size="9" fill="#4a7a5a">  kolejnego n-la</text>
    <text x="420" y="236" font-size="9" fill="#4a7a5a">● Ocena programu COVE</text>
    <circle cx="480" cy="318" r="22" fill="#3a8a5a" opacity="0.1"/>
    <text x="480" y="314" text-anchor="middle" font-size="22">💬</text>
    <text x="480" y="336" text-anchor="middle" font-size="9" fill="#3a8a5a">raport mentorski</text>
  </g>

  <!-- Arrow 3→4 -->
  <path d="M554,220 L592,220" stroke="#3a8a5a" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- Step 4: PLAN ROK+1 -->
  <g filter="url(#sh)">
    <rect x="594" y="90" width="106" height="260" rx="12" fill="white"/>
    <rect x="594" y="90" width="106" height="40" rx="10" fill="#e8a020"/>
    <text x="647" y="107" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">4. PLAN</text>
    <text x="647" y="120" text-anchor="middle" font-size="9" fill="#fff3d0">NA ROK +1</text>

    <text x="604" y="148" font-size="9" fill="#7a5a2a">● Priorytety</text>
    <text x="604" y="164" font-size="9" fill="#7a5a2a">  dydaktyczne</text>
    <text x="604" y="184" font-size="9" fill="#7a5a2a">● Szkolenia</text>
    <text x="604" y="200" font-size="9" fill="#7a5a2a">  i kursy</text>
    <text x="604" y="220" font-size="9" fill="#7a5a2a">● Cele awansu</text>
    <text x="604" y="240" font-size="9" fill="#7a5a2a">  zawodowego</text>
    <circle cx="647" cy="318" r="22" fill="#e8a020" opacity="0.15"/>
    <text x="647" y="314" text-anchor="middle" font-size="22">🚀</text>
    <text x="647" y="336" text-anchor="middle" font-size="9" fill="#c07010">nowy cykl</text>
  </g>

  <!-- Loop back arrow: from step 4 bottom to step 1 bottom -->
  <path d="M647,362 Q647,400 360,400 Q73,400 73,362" stroke="#e8a020" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrG)"/>
  <rect x="280" y="388" width="160" height="20" rx="8" fill="white" opacity="0.9"/>
  <text x="360" y="402" text-anchor="middle" font-size="9" font-weight="700" fill="#b07010">PĘTLA UCZENIA SIĘ ORGANIZACJI</text>

  <!-- Progress bar bottom -->
  <rect x="30" y="418" width="660" height="12" rx="5" fill="#e8a020" opacity="0.15"/>
  <text x="360" y="427" text-anchor="middle" font-size="8" fill="#b07010">Wnioski z tego roku zasilają program wdrożenia na kolejny rok szkolny</text>
</svg>
