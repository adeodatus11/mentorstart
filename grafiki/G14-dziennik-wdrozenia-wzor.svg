<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/></filter>
  </defs>

  <!-- Page background (paper look) -->
  <rect width="640" height="500" fill="#f8f9fa" rx="8"/>
  <rect width="640" height="500" fill="none" stroke="#dee2e6" stroke-width="1" rx="8"/>

  <!-- Top binding strip -->
  <rect width="640" height="48" fill="#2D7D4F" rx="8"/>
  <rect y="38" width="640" height="10" fill="#2D7D4F"/>
  <!-- Ring holes -->
  <circle cx="60" cy="24" r="10" fill="#1a4a2a"/>
  <circle cx="60" cy="24" r="6" fill="white" opacity="0.3"/>
  <circle cx="160" cy="24" r="10" fill="#1a4a2a"/>
  <circle cx="160" cy="24" r="6" fill="white" opacity="0.3"/>
  <circle cx="260" cy="24" r="10" fill="#1a4a2a"/>
  <circle cx="260" cy="24" r="6" fill="white" opacity="0.3"/>
  <circle cx="360" cy="24" r="10" fill="#1a4a2a"/>
  <circle cx="360" cy="24" r="6" fill="white" opacity="0.3"/>
  <circle cx="460" cy="24" r="10" fill="#1a4a2a"/>
  <circle cx="460" cy="24" r="6" fill="white" opacity="0.3"/>
  <circle cx="560" cy="24" r="10" fill="#1a4a2a"/>
  <circle cx="560" cy="24" r="6" fill="white" opacity="0.3"/>
  <text x="320" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="white" letter-spacing="2">DZIENNIK WDROŻENIA NAUCZYCIELA</text>

  <!-- Horizontal ruled lines -->
  <line x1="24" y1="74" x2="616" y2="74" stroke="#e0e6e0" stroke-width="0.5"/>
  <line x1="24" y1="90" x2="616" y2="90" stroke="#e0e6e0" stroke-width="0.5"/>

  <!-- Entry form -->
  <rect x="20" y="58" width="600" height="422" rx="6" fill="white" filter="url(#sh)"/>

  <!-- Row 1: Data + Etap -->
  <rect x="20" y="58" width="600" height="32" rx="6" fill="#f0f7f4"/>
  <!-- Data -->
  <text x="32" y="78" font-size="10" font-weight="700" fill="#2D7D4F">DATA SPOTKANIA:</text>
  <line x1="160" y1="78" x2="310" y2="78" stroke="#2D7D4F" stroke-width="1"/>
  <text x="316" y="78" font-size="10" fill="#b0b8b0">dd.mm.rrrr</text>
  <!-- Etap -->
  <text x="360" y="78" font-size="10" font-weight="700" fill="#1E6B9E">ETAP:</text>
  <line x1="395" y1="78" x2="610" y2="78" stroke="#1E6B9E" stroke-width="1"/>
  <text x="398" y="78" font-size="10" fill="#b0c0d0">np. Tydzień 2, Miesiąc 2...</text>

  <!-- Row 2: Uczestnicy -->
  <rect x="20" y="96" width="600" height="26" fill="#fafafa"/>
  <text x="32" y="113" font-size="10" font-weight="700" fill="#2D7D4F">UCZESTNICY:</text>
  <text x="110" y="113" font-size="10" fill="#8a9a8a">Mentor: _________________________</text>
  <text x="350" y="113" font-size="10" fill="#8a9a8a">Nauczyciel: ____________________</text>

  <!-- Section: Temat rozmowy -->
  <rect x="20" y="124" width="600" height="20" fill="#e8f4ee"/>
  <text x="32" y="138" font-size="10" font-weight="700" fill="#2D7D4F">TEMAT ROZMOWY / CEL SPOTKANIA</text>
  <rect x="20" y="144" width="600" height="50" fill="white"/>
  <line x1="32" y1="158" x2="608" y2="158" stroke="#d8e8d8" stroke-width="0.8"/>
  <line x1="32" y1="172" x2="608" y2="172" stroke="#d8e8d8" stroke-width="0.8"/>
  <line x1="32" y1="186" x2="608" y2="186" stroke="#d8e8d8" stroke-width="0.8"/>

  <!-- Section: Ustalenia -->
  <rect x="20" y="196" width="600" height="20" fill="#e8f4ee"/>
  <text x="32" y="210" font-size="10" font-weight="700" fill="#2D7D4F">USTALENIA I WNIOSKI ZE SPOTKANIA</text>
  <rect x="20" y="216" width="600" height="70" fill="white"/>
  <line x1="32" y1="230" x2="608" y2="230" stroke="#d8e8d8" stroke-width="0.8"/>
  <line x1="32" y1="244" x2="608" y2="244" stroke="#d8e8d8" stroke-width="0.8"/>
  <line x1="32" y1="258" x2="608" y2="258" stroke="#d8e8d8" stroke-width="0.8"/>
  <line x1="32" y1="272" x2="608" y2="272" stroke="#d8e8d8" stroke-width="0.8"/>
  <line x1="32" y1="286" x2="608" y2="286" stroke="#d8e8d8" stroke-width="0.8"/>

  <!-- Section: Zadania i odpowiedzialność -->
  <rect x="20" y="288" width="600" height="20" fill="#e8eef8"/>
  <text x="32" y="302" font-size="10" font-weight="700" fill="#1E6B9E">ZADANIA DO WYKONANIA</text>
  <rect x="20" y="308" width="600" height="70" fill="white"/>
  <!-- Two columns -->
  <text x="32" y="326" font-size="9" fill="#4a6a7a">Zadanie</text>
  <text x="300" y="326" font-size="9" fill="#4a6a7a">Odpowiedzialny</text>
  <text x="450" y="326" font-size="9" fill="#4a6a7a">Termin</text>
  <line x1="32" y1="329" x2="608" y2="329" stroke="#c8d8e8" stroke-width="0.8"/>
  <line x1="290" y1="308" x2="290" y2="378" stroke="#c8d8e8" stroke-width="0.8"/>
  <line x1="440" y1="308" x2="440" y2="378" stroke="#c8d8e8" stroke-width="0.8"/>
  <line x1="32" y1="344" x2="608" y2="344" stroke="#d8e8f0" stroke-width="0.8"/>
  <line x1="32" y1="360" x2="608" y2="360" stroke="#d8e8f0" stroke-width="0.8"/>
  <text x="40" y="342" font-size="8" fill="#c0c8d0">1. ________________________________</text>
  <text x="40" y="358" font-size="8" fill="#c0c8d0">2. ________________________________</text>
  <text x="40" y="374" font-size="8" fill="#c0c8d0">3. ________________________________</text>

  <!-- Section: Pytania na kolejne spotkanie -->
  <rect x="20" y="380" width="600" height="20" fill="#f4f0e8"/>
  <text x="32" y="394" font-size="10" font-weight="700" fill="#b07010">PYTANIA NA KOLEJNE SPOTKANIE</text>
  <rect x="20" y="400" width="600" height="40" fill="white"/>
  <line x1="32" y1="415" x2="608" y2="415" stroke="#e8d8b0" stroke-width="0.8"/>
  <line x1="32" y1="430" x2="608" y2="430" stroke="#e8d8b0" stroke-width="0.8"/>

  <!-- Footer: podpisy -->
  <rect x="20" y="442" width="600" height="36" rx="4" fill="#f0f7f4"/>
  <text x="32" y="457" font-size="9" fill="#2D7D4F" font-weight="700">Podpis mentora:</text>
  <line x1="120" y1="458" x2="290" y2="458" stroke="#2D7D4F" stroke-width="1"/>
  <text x="310" y="457" font-size="9" fill="#1E6B9E" font-weight="700">Podpis nauczyciela:</text>
  <line x1="420" y1="458" x2="608" y2="458"/>
  <text x="56" y="472" font-size="8" fill="#8a9a8a">Data: ___________</text>
  <text x="356" y="472" font-size="8" fill="#8a9a8a">Data: ___________</text>

  <!-- COVE watermark -->
  <text x="320" y="492" text-anchor="middle" font-size="8" fill="#c0c8c0">COVE · WP3 A4 · Program wdrożenia nauczyciela · ZSZ5 Wrocław</text>
</svg>
