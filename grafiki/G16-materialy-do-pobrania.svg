<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#eef8f4"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.14"/></filter>
    <filter id="sh2"><feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="760" height="320" fill="url(#bg)" rx="12"/>
  <rect width="760" height="4" fill="#2D7D4F" rx="2"/>

  <!-- Header -->
  <rect x="16" y="12" width="728" height="44" rx="8" fill="#1a3a2a"/>
  <text x="380" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="white" letter-spacing="1">MATERIAŁY DO POBRANIA — PAKIET WDROŻENIOWY</text>
  <text x="380" y="46" text-anchor="middle" font-size="9" fill="#8ab8a0">5 dokumentów operacyjnych · Format PDF · Program COVE WP3 A4</text>

  <!-- Document card helper macro — 5 cards -->
  <!-- Card 1: Pakiet startowy -->
  <g filter="url(#sh)">
    <!-- Paper -->
    <rect x="28" y="74" width="126" height="166" rx="6" fill="white"/>
    <!-- Folded corner -->
    <polygon points="128,74 154,74 154,100" fill="#2D7D4F" opacity="0.15"/>
    <polygon points="128,74 154,100 128,100" fill="#e0ece0"/>
    <!-- Color stripe -->
    <rect x="28" y="74" width="126" height="10" rx="5" fill="#2D7D4F"/>
    <!-- PDF badge -->
    <rect x="102" y="82" width="26" height="12" rx="3" fill="#c0392b"/>
    <text x="115" y="92" text-anchor="middle" font-size="7" font-weight="700" fill="white">PDF</text>
    <!-- Icon -->
    <text x="91" y="128" text-anchor="middle" font-size="28">📦</text>
    <!-- Title -->
    <text x="91" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">PAKIET</text>
    <text x="91" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">STARTOWY</text>
    <!-- Description -->
    <text x="91" y="185" text-anchor="middle" font-size="8" fill="#4a7a5a">Komplet dokumentów</text>
    <text x="91" y="197" text-anchor="middle" font-size="8" fill="#4a7a5a">przed 1. dniem</text>
    <!-- Download btn -->
    <rect x="36" y="210" width="110" height="22" rx="6" fill="#2D7D4F"/>
    <text x="91" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="white">⬇ Pobierz</text>
  </g>

  <!-- Card 2: Checklista tydzień 1 -->
  <g filter="url(#sh)">
    <rect x="172" y="74" width="126" height="166" rx="6" fill="white"/>
    <polygon points="272,74 298,74 298,100" fill="#3a8a5a" opacity="0.15"/>
    <polygon points="272,74 298,100 272,100" fill="#e4f0e4"/>
    <rect x="172" y="74" width="126" height="10" rx="5" fill="#3a8a5a"/>
    <rect x="246" y="82" width="26" height="12" rx="3" fill="#c0392b"/>
    <text x="259" y="92" text-anchor="middle" font-size="7" font-weight="700" fill="white">PDF</text>
    <text x="235" y="128" text-anchor="middle" font-size="28">✅</text>
    <text x="235" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">CHECKLISTA</text>
    <text x="235" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">TYGODNIA 1</text>
    <text x="235" y="185" text-anchor="middle" font-size="8" fill="#4a7a5a">5 rzeczy do</text>
    <text x="235" y="197" text-anchor="middle" font-size="8" fill="#4a7a5a">uruchomienia</text>
    <rect x="180" y="210" width="110" height="22" rx="6" fill="#3a8a5a"/>
    <text x="235" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="white">⬇ Pobierz</text>
  </g>

  <!-- Card 3: Agenda rozmowy mentorskiej -->
  <g filter="url(#sh)">
    <rect x="316" y="74" width="126" height="166" rx="6" fill="white"/>
    <polygon points="416,74 442,74 442,100" fill="#1E6B9E" opacity="0.15"/>
    <polygon points="416,74 442,100 416,100" fill="#ddeef8"/>
    <rect x="316" y="74" width="126" height="10" rx="5" fill="#1E6B9E"/>
    <rect x="390" y="82" width="26" height="12" rx="3" fill="#c0392b"/>
    <text x="403" y="92" text-anchor="middle" font-size="7" font-weight="700" fill="white">PDF</text>
    <text x="379" y="128" text-anchor="middle" font-size="28">🗣️</text>
    <text x="379" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">AGENDA</text>
    <text x="379" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">ROZMOWY</text>
    <text x="379" y="185" text-anchor="middle" font-size="8" fill="#4a6a7a">Schemat spotkania</text>
    <text x="379" y="197" text-anchor="middle" font-size="8" fill="#4a6a7a">mentorskiego</text>
    <rect x="324" y="210" width="110" height="22" rx="6" fill="#1E6B9E"/>
    <text x="379" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="white">⬇ Pobierz</text>
  </g>

  <!-- Card 4: Checklista klasyfikacji -->
  <g filter="url(#sh)">
    <rect x="460" y="74" width="126" height="166" rx="6" fill="white"/>
    <polygon points="560,74 586,74 586,100" fill="#165a8e" opacity="0.15"/>
    <polygon points="560,74 586,100 560,100" fill="#d8e8f4"/>
    <rect x="460" y="74" width="126" height="10" rx="5" fill="#165a8e"/>
    <rect x="534" y="82" width="26" height="12" rx="3" fill="#c0392b"/>
    <text x="547" y="92" text-anchor="middle" font-size="7" font-weight="700" fill="white">PDF</text>
    <text x="523" y="128" text-anchor="middle" font-size="28">📊</text>
    <text x="523" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">CHECKLISTA</text>
    <text x="523" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">KLASYFIKACJI</text>
    <text x="523" y="185" text-anchor="middle" font-size="8" fill="#4a6a7a">Oceny, obecności,</text>
    <text x="523" y="197" text-anchor="middle" font-size="8" fill="#4a6a7a">rada pedagogiczna</text>
    <rect x="468" y="210" width="110" height="22" rx="6" fill="#165a8e"/>
    <text x="523" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="white">⬇ Pobierz</text>
  </g>

  <!-- Card 5: Zamknięcie roku -->
  <g filter="url(#sh)">
    <rect x="606" y="74" width="126" height="166" rx="6" fill="white"/>
    <polygon points="706,74 732,74 732,100" fill="#e8a020" opacity="0.2"/>
    <polygon points="706,74 732,100 706,100" fill="#faecd8"/>
    <rect x="606" y="74" width="126" height="10" rx="5" fill="#e8a020"/>
    <rect x="680" y="82" width="26" height="12" rx="3" fill="#c0392b"/>
    <text x="693" y="92" text-anchor="middle" font-size="7" font-weight="700" fill="white">PDF</text>
    <text x="669" y="128" text-anchor="middle" font-size="28">🏁</text>
    <text x="669" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">ZAMKNIĘCIE</text>
    <text x="669" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#1a3a2a">ROKU</text>
    <text x="669" y="185" text-anchor="middle" font-size="8" fill="#7a5a2a">Ewaluacja, wnioski,</text>
    <text x="669" y="197" text-anchor="middle" font-size="8" fill="#7a5a2a">plan roku +1</text>
    <rect x="614" y="210" width="110" height="22" rx="6" fill="#e8a020"/>
    <text x="669" y="225" text-anchor="middle" font-size="9" font-weight="700" fill="white">⬇ Pobierz</text>
  </g>

  <!-- Bottom note -->
  <text x="380" y="262" text-anchor="middle" font-size="9" fill="#6a8a7a">Wszystkie dokumenty dostępne w sekcji Materiały operacyjne · Format A4 do druku lub PDF do wypełnienia cyfrowego</text>

  <!-- Color legend strip -->
  <rect x="28" y="276" width="126" height="30" rx="6" fill="#2D7D4F" opacity="0.1"/>
  <text x="91" y="296" text-anchor="middle" font-size="8" fill="#2D7D4F" font-weight="700">Etap 0</text>
  <rect x="172" y="276" width="126" height="30" rx="6" fill="#3a8a5a" opacity="0.1"/>
  <text x="235" y="296" text-anchor="middle" font-size="8" fill="#3a8a5a" font-weight="700">Etap 1</text>
  <rect x="316" y="276" width="126" height="30" rx="6" fill="#1E6B9E" opacity="0.1"/>
  <text x="379" y="296" text-anchor="middle" font-size="8" fill="#1E6B9E" font-weight="700">Każdy etap</text>
  <rect x="460" y="276" width="126" height="30" rx="6" fill="#165a8e" opacity="0.1"/>
  <text x="523" y="296" text-anchor="middle" font-size="8" fill="#165a8e" font-weight="700">Półrocze 1</text>
  <rect x="606" y="276" width="126" height="30" rx="6" fill="#e8a020" opacity="0.1"/>
  <text x="669" y="296" text-anchor="middle" font-size="8" fill="#c07010" font-weight="700">Koniec roku</text>
</svg>
