<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8f4fb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D7D4F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E6B9E;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1E6B9E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#pathGrad)" rx="2"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a3a2a" letter-spacing="0.5">MAPA DROGI WDROŻENIA NAUCZYCIELA</text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#4a7a5a" letter-spacing="1">od przygotowania do samodzielnej pracy</text>

  <!-- Road path (curved) -->
  <path d="M 80,200 C 180,200 180,160 300,160 C 420,160 420,200 540,200 C 660,200 660,150 780,150 C 900,150 900,200 1020,200 C 1080,200 1110,190 1130,180" stroke="url(#pathGrad)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.25"/>
  <path d="M 80,200 C 180,200 180,160 300,160 C 420,160 420,200 540,200 C 660,200 660,150 780,150 C 900,150 900,200 1020,200 C 1080,200 1110,190 1130,180" stroke="url(#pathGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="8,5"/>

  <!-- Stage data: x, y, label, sublabel, color -->
  <!-- Stage 0: Przed startem -->
  <g filter="url(#shadow)">
    <circle cx="80" cy="200" r="28" fill="#2D7D4F"/>
    <text x="80" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="white">ETW</text>
    <text x="80" y="210" text-anchor="middle" font-size="10" fill="white">0</text>
  </g>
  <text x="80" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">PRZED</text>
  <text x="80" y="256" text-anchor="middle" font-size="10" fill="#4a7a5a">STARTEM</text>
  <rect x="46" y="265" width="68" height="18" rx="4" fill="#2D7D4F" opacity="0.12"/>
  <text x="80" y="278" text-anchor="middle" font-size="9" fill="#2D7D4F">Pakiet startowy</text>

  <!-- Stage 1: Tydzień 1 -->
  <g filter="url(#shadow)">
    <circle cx="215" cy="160" r="28" fill="#2D7D4F"/>
    <text x="215" y="156" text-anchor="middle" font-size="9" font-weight="700" fill="white">TYDZIEŃ</text>
    <text x="215" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
  </g>
  <text x="215" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">PIERWSZY</text>
  <text x="215" y="216" text-anchor="middle" font-size="10" fill="#4a7a5a">TYDZIEŃ</text>
