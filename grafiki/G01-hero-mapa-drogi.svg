    <text x="500" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="white">3</text>
  </g>
  <text x="500" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">PSO</text>
  <text x="500" y="256" text-anchor="middle" font-size="10" fill="#4a7a5a">I WYMAGANIA</text>
