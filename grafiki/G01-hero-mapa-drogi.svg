  <text x="1150" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">EWALUACJA</text>
  <text x="1150" y="240" text-anchor="middle" font-size="10" fill="#7a5a2a">I ZAMKNIĘCIE</text>
  <rect x="1105" y="249" width="90" height="18" rx="4" fill="#e8a020" opacity="0.12"/>
  <text x="1150" y="262" text-anchor="middle" font-size="9" fill="#c07010">Wnioski, plan rok+1</text>

  <!-- Connector dots between stages -->
  <circle cx="147" cy="182" r="4" fill="#2D7D4F" opacity="0.5"/>
  <circle cx="157" cy="174" r="3" fill="#2D7D4F" opacity="0.4"/>
  <circle cx="285" cy="160" r="4" fill="#3a8a5a" opacity="0.5"/>
  <circle cx="430" cy="174" r="4" fill="#4a9a6a" opacity="0.5"/>
  <circle cx="570" cy="200" r="4" fill="#2a7a9a" opacity="0.5"/>
  <circle cx="707" cy="178" r="4" fill="#1E6B9E" opacity="0.5"/>
  <circle cx="843" cy="172" r="4" fill="#165a8e" opacity="0.5"/>
  <circle cx="975" cy="200" r="4" fill="#0d4a7e" opacity="0.5"/>
  <circle cx="1090" cy="188" r="4" fill="#0d4a7e" opacity="0.5"/>

  <!-- Legend -->
  <rect x="30" y="310" width="560" height="52" rx="8" fill="white" opacity="0.7"/>
  <text x="44" y="328" font-size="10" font-weight="700" fill="#1a3a2a">LEGENDA:</text>
  <circle cx="110" cy="324" r="7" fill="#2D7D4F"/>
  <text x="122" y="328" font-size="10" fill="#1a3a2a">Etapy z mentorem</text>
  <circle cx="250" cy="324" r="7" fill="#1E6B9E"/>
  <text x="262" y="328" font-size="10" fill="#1a3a2a">Etapy konsolidacji</text>
  <circle cx="390" cy="324" r="7" fill="#e8a020"/>
  <text x="402" y="328" font-size="10" fill="#1a3a2a">Zamknięcie cyklu</text>
  <text x="44" y="350" font-size="9" fill="#5a7a6a">Czas trwania pełnego cyklu wdrożenia: 1 rok szkolny | Mentor: opiekun stażu/wychowawca doświadczony | Program: COVE WP3 A4</text>

  <!-- Right info box -->
  <rect x="620" y="310" width="550" height="52" rx="8" fill="white" opacity="0.7"/>
  <text x="636" y="328" font-size="10" font-weight="700" fill="#1E6B9E">FILARY WSPARCIA:</text>
  <text x="636" y="344" font-size="9.5" fill="#1a3a2a">🗂 Dziennik wdrożenia  |  👥 Spotkania mentorskie  |  📋 Checklistas etapów  |  📚 Baza wiedzy</text>
  <text x="636" y="357" font-size="9" fill="#5a7a8a">Nauczyciel nie jest sam – każdy etap ma wsparcie, narzędzia i osobę kontaktową.</text>
</svg>
