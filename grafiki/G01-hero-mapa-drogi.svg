  <text x="910" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">KLASYFIKACJA</text>
  <text x="910" y="256" text-anchor="middle" font-size="10" fill="#4a6a7a">ŚRÓDROCZNA</text>
  <rect x="868" y="265" width="84" height="18" rx="4" fill="#165a8e" opacity="0.12"/>
  <text x="910" y="278" text-anchor="middle" font-size="9" fill="#165a8e">Checklista ocen</text>

  <!-- Stage 7: Półrocze 2 -->
