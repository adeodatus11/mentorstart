<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f8f0"/>
      <stop offset="100%" style="stop-color:#eef6ea"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="700" height="420" fill="url(#bg)" rx="16"/>
  <rect width="700" height="5" fill="#4a9a6a" rx="2"/>

  <!-- Header -->
  <rect x="20" y="14" width="660" height="54" rx="10" fill="#2D7D4F"/>
  <text x="350" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="white">ETAP 3 · PSO I WYMAGANIA EDUKACYJNE</text>
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#a8d8bc">Od dokumentu do jasnych kryteriów — uczeń wie, czego się uczyć</text>

  <!-- Flow: PSO document → components → student -->

  <!-- PSO Document -->
  <g filter="url(#sh)">
    <rect x="30" y="90" width="160" height="240" rx="12" fill="white"/>
    <rect x="30" y="90" width="160" height="40" rx="10" fill="#2D7D4F"/>
    <text x="110" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="white">DOKUMENT PSO</text>
    <text x="110" y="122" text-anchor="middle" font-size="9" fill="#a8d8bc">Przedmiotowy System</text>
    <text x="44" y="150" font-size="9" fill="#4a7a5a">§ Zasady oceniania</text>
    <line x1="44" y1="155" x2="176" y2="155" stroke="#e0ece0" stroke-width="1"/>
    <text x="44" y="172" font-size="9" fill="#4a7a5a">§ Wymagania na oceny</text>
    <line x1="44" y1="177" x2="176" y2="177" stroke="#e0ece0" stroke-width="1"/>
    <text x="44" y="194" font-size="9" fill="#4a7a5a">§ Formy sprawdzania</text>
    <line x1="44" y1="199" x2="176" y2="199" stroke="#e0ece0" stroke-width="1"/>
    <text x="44" y="216" font-size="9" fill="#4a7a5a">§ Dostosowania dla uczniów</text>
    <line x1="44" y1="221" x2="176" y2="221" stroke="#e0ece0" stroke-width="1"/>
    <text x="44" y="238" font-size="9" fill="#4a7a5a">§ Zasady poprawiania</text>
    <line x1="44" y1="243" x2="176" y2="243" stroke="#e0ece0" stroke-width="1"/>
    <text x="44" y="260" font-size="9" fill="#4a7a5a">§ Informacja dla uczniów</text>
    <!-- Stamp -->
    <circle cx="110" cy="300" r="24" fill="none" stroke="#2D7D4F" stroke-width="2" opacity="0.5"/>
    <text x="110" y="296" text-anchor="middle" font-size="8" fill="#2D7D4F" font-weight="700">ZGODNY</text>
    <text x="110" y="308" text-anchor="middle" font-size="8" fill="#2D7D4F">ZE STATUTEM</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M190,210 L240,210" stroke="#2D7D4F" stroke-width="2.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2D7D4F"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1E6B9E"/>
    </marker>
  </defs>

  <!-- Middle: 3 components -->
  <!-- Kryteria oceniania -->
  <g filter="url(#sh)">
    <rect x="248" y="90" width="160" height="90" rx="10" fill="white"/>
    <rect x="248" y="90" width="160" height="8" rx="4" fill="#4a9a6a"/>
    <text x="328" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">KRYTERIA OCENIANIA</text>
    <text x="328" y="132" text-anchor="middle" font-size="9" fill="#4a7a5a">cel → kryterium → poziom</text>
    <text x="258" y="152" font-size="9" fill="#4a7a5a">1  Niedostateczny — poniżej 30%</text>
    <text x="258" y="163" font-size="9" fill="#4a7a5a">2-5  Dopuszczający ... Celujący</text>
    <text x="258" y="174" font-size="9" fill="#4a9a6a">✓ Skala czytelna dla ucznia</text>
  </g>

  <!-- Dostosowania -->
  <g filter="url(#sh)">
    <rect x="248" y="196" width="160" height="84" rx="10" fill="white"/>
    <rect x="248" y="196" width="160" height="8" rx="4" fill="#1E6B9E"/>
    <text x="328" y="221" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">DOSTOSOWANIA</text>
    <text x="258" y="238" font-size="9" fill="#4a6a7a">● Opinie PPP — formy sprawdz.</text>
    <text x="258" y="251" font-size="9" fill="#4a6a7a">● Orzeczenia — indyw. wymagania</text>
    <text x="258" y="264" font-size="9" fill="#1E6B9E">✓ Zgodność z zaleceniami</text>
  </g>

  <!-- Formy sprawdzania -->
  <g filter="url(#sh)">
    <rect x="248" y="296" width="160" height="74" rx="10" fill="white"/>
    <rect x="248" y="296" width="160" height="8" rx="4" fill="#d4820a"/>
    <text x="328" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1a3a2a">FORMY SPRAWDZANIA</text>
    <text x="258" y="337" font-size="9" fill="#7a5a2a">● Kartkówki, testy, prace</text>
    <text x="258" y="350" font-size="9" fill="#7a5a2a">● Odpowiedzi ustne, projekty</text>
    <text x="258" y="363" font-size="9" fill="#d4820a">✓ Plan na semestr</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M408,210 L458,210" stroke="#1E6B9E" stroke-width="2.5" marker-end="url(#arrB)"/>

  <!-- Right: Student outcome -->
  <g filter="url(#sh)">
    <rect x="464" y="90" width="202" height="240" rx="12" fill="white"/>
    <rect x="464" y="90" width="202" height="40" rx="10" fill="#1E6B9E"/>
    <text x="565" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="white">UCZEŃ WIE:</text>
    <text x="565" y="122" text-anchor="middle" font-size="9" fill="#c0daf4">Jasne zasady od początku roku</text>

    <!-- student icon -->
    <circle cx="565" cy="158" r="20" fill="#e8f0f8"/>
    <circle cx="565" cy="152" r="9" fill="#1E6B9E"/>
    <path d="M545,172 Q565,162 585,172" stroke="#1E6B9E" stroke-width="2" fill="none"/>

    <text x="474" y="198" font-size="9" fill="#1a3a2a">✅ Jak jest oceniany</text>
    <text x="474" y="214" font-size="9" fill="#1a3a2a">✅ Co musi umieć na daną ocenę</text>
    <text x="474" y="230" font-size="9" fill="#1a3a2a">✅ Jak poprawić ocenę</text>
    <text x="474" y="246" font-size="9" fill="#1a3a2a">✅ Jakie dostosowania go dotyczą</text>
    <text x="474" y="262" font-size="9" fill="#1a3a2a">✅ Kiedy i jak jest sprawdzany</text>

    <rect x="474" y="278" width="180" height="40" rx="6" fill="#1E6B9E" opacity="0.08"/>
    <text x="564" y="295" text-anchor="middle" font-size="9" font-weight="700" fill="#1E6B9E">PSO omówione z klasą</text>
    <text x="564" y="310" text-anchor="middle" font-size="9" fill="#1E6B9E">w 1. tygodniu, zapisane w dzienniku</text>
  </g>

  <!-- Bottom note -->
  <rect x="30" y="352" width="640" height="50" rx="10" fill="white" opacity="0.8" filter="url(#sh)"/>
  <text x="350" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#2D7D4F">💡 WSKAZÓWKA MENTORA:</text>
  <text x="350" y="390" text-anchor="middle" font-size="10" fill="#1a3a2a">Przekaż PSO uczniom na piśmie lub przez dziennik elektroniczny w pierwszym tygodniu. Zapytaj mentora o wzór stosowany w szkole.</text>
</svg>
